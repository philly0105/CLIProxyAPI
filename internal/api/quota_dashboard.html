<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Quota Management</title>
<script>
  // Apply the stored or system theme before first paint.
  (function () {
    try {
      var p = JSON.parse(localStorage.getItem('cpa-quota-prefs') || '{}') || {};
      var t = p.theme === 'light' || p.theme === 'dark' ? p.theme : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      if (t === 'light') document.documentElement.classList.add('light');
    } catch (e) {}
  })();
</script>
<style>
  /* ---------- Tokens ---------- */
  :root {
    color-scheme: dark;
    --bg: #0f0d0c; --surface: #171412; --surface-2: #1f1b18; --surface-3: #29231f;
    --line: #2a2420; --line-2: #342d28; --line-ctl: #6e635b;
    --ink: #f2ece7; --ink-2: #c2b8b0; --ink-3: #9a8f87;
    --accent: #e0825f; --on-accent: #1d1410;
    --accent-soft: rgba(224, 130, 95, .12);
    /* Data series wear neutral warm ink. Terracotta is brand, selection and primary actions; status colors mean status. */
    --series: #ddd3cb; --series-band: rgba(221, 211, 203, .07); --series-bar: #a99d94;
    --grid: #2a2420; --track: #3a322d; --meter: #a99d94; --muted-fill: #5c524b;
    --good: #5cc28a; --warn: #e8c065; --bad: #ef6083; --warn-fill: #e8c065;
    --good-bg: rgba(92, 194, 138, .12); --good-bd: rgba(92, 194, 138, .34);
    --warn-bg: rgba(232, 192, 101, .12); --warn-bd: rgba(232, 192, 101, .34);
    --bad-bg: rgba(239, 96, 131, .14); --bad-bd: rgba(239, 96, 131, .40);
    --neutral-bg: rgba(242, 236, 231, .06); --neutral-bd: rgba(242, 236, 231, .18);
    --focus: #7cb2ff;
    --shadow: 0 12px 32px rgba(0, 0, 0, .5);
    --font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, "Liberation Sans", sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    /* 4 px spacing scale */
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s8: 32px; --s12: 48px;
    /* three control heights */
    --h-sm: 28px; --h-md: 32px; --h-lg: 40px;
    /* one radius family */
    --r1: 4px; --r2: 8px; --r3: 12px;
    /* type scale */
    --t-xs: 12px; --t-sm: 13px; --t-md: 14px; --t-lg: 20px; --t-xl: 28px;
  }
  :root.light {
    color-scheme: light;
    --bg: #f6f3f0; --surface: #ffffff; --surface-2: #f3eeea; --surface-3: #ebe4de;
    --line: #ece5df; --line-2: #e0d7cf; --line-ctl: #93877e;
    --ink: #1d1916; --ink-2: #4f4741; --ink-3: #6f665f;
    --accent: #b9532f; --on-accent: #ffffff;
    --accent-soft: rgba(185, 83, 47, .09);
    --series: #39312b; --series-band: rgba(57, 49, 43, .06); --series-bar: #7f746c;
    --grid: #efe9e4; --track: #e6ddd6; --meter: #7f746c; --muted-fill: #c4b9b0;
    --good: #1f7a4d; --warn: #8a6500; --bad: #c22a55;
    /* Meter fill for Low: #8a6500 is text-dark and too close to the neutral meter as a fill. */
    --warn-fill: #c98a00;
    --good-bg: rgba(31, 122, 77, .09); --good-bd: rgba(31, 122, 77, .32);
    --warn-bg: rgba(138, 101, 0, .09); --warn-bd: rgba(138, 101, 0, .34);
    --bad-bg: rgba(194, 42, 85, .08); --bad-bd: rgba(194, 42, 85, .34);
    --neutral-bg: rgba(29, 25, 22, .04); --neutral-bd: rgba(29, 25, 22, .16);
    --focus: #1f5fcf;
    --shadow: 0 12px 32px rgba(60, 40, 30, .16);
  }

  /* ---------- Base ---------- */
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 var(--t-sm)/1.5 var(--font); -webkit-font-smoothing: antialiased; }
  button, select, input { font: inherit; color: inherit; }
  h1, h2, h3, p { margin: 0; }
  [hidden] { display: none !important; }
  .sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; }
  .nw { white-space: nowrap; }
  code { font-family: var(--mono); font-size: var(--t-xs); }
  .i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .i.sm { width: 14px; height: 14px; }
  .i.lg { width: 24px; height: 24px; stroke-width: 1.5; }
  ::placeholder { color: var(--ink-3); opacity: 1; }

  /* ---------- Controls ---------- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s2); height: var(--h-md); padding: 0 var(--s3);
    background: var(--surface-2); border: 1px solid var(--line-2); border-radius: var(--r2); cursor: pointer; font-size: var(--t-sm); font-weight: 500;
    white-space: nowrap; color: var(--ink); text-decoration: none; }
  .btn:hover { background: var(--surface-3); border-color: var(--line-ctl); }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
  .btn.ghost:hover { background: var(--surface-2); color: var(--ink); border-color: var(--line-2); }
  .btn.icon { width: var(--h-md); padding: 0; }
  .btn.sm { height: var(--h-sm); padding: 0 var(--s2); font-size: var(--t-xs); gap: var(--s1); }
  .btn.sm.icon { width: var(--h-sm); padding: 0; }
  .btn.lg { height: var(--h-lg); padding: 0 var(--s4); font-size: var(--t-md); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn.primary:hover { filter: brightness(1.06); }
  .btn[aria-pressed="true"] { color: var(--ink); background: var(--surface-2); border-color: var(--line-2); }
  .btn[aria-expanded="true"] { color: var(--ink); background: var(--surface-3); border-color: var(--line-ctl); }
  .btn[aria-disabled="true"] { cursor: progress; }
  @media (prefers-reduced-motion: no-preference) {
    .busy .spin, .spin.on { animation: spin .8s linear infinite; }
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .field { position: relative; display: inline-flex; align-items: center; height: var(--h-md); border: 1px solid var(--line-ctl); border-radius: var(--r2);
    background: var(--surface); font-size: var(--t-sm); min-width: 0; }
  .field:hover { background: var(--surface-2); }
  .field:focus-within { outline: 2px solid var(--focus); outline-offset: 2px; }
  .field > span { padding-left: var(--s3); color: var(--ink-3); white-space: nowrap; pointer-events: none; }
  .field select { appearance: none; -webkit-appearance: none; height: 100%; border: 0; background: transparent; padding: 0 30px 0 var(--s2); cursor: pointer;
    font-weight: 500; color: var(--ink); min-width: 0; border-radius: var(--r2); }
  .field select:focus-visible { outline: none; }
  .field select option { background: var(--surface); color: var(--ink); }
  .field .chev { position: absolute; right: 9px; top: 50%; margin-top: -7px; color: var(--ink-3); pointer-events: none; }

  .search { position: relative; display: flex; align-items: center; height: var(--h-md); min-width: 0; flex: 1 1 220px; max-width: 320px;
    border: 1px solid var(--line-ctl); border-radius: var(--r2); background: var(--surface); }
  .search:focus-within { outline: 2px solid var(--focus); outline-offset: 2px; }
  .search > .i { position: absolute; left: 10px; color: var(--ink-3); pointer-events: none; }
  .search input { width: 100%; min-width: 0; height: 100%; border: 0; background: transparent; padding: 0 var(--s3) 0 34px; font-size: var(--t-sm); border-radius: var(--r2); }
  .search input:focus-visible { outline: none; }
  .search input::-webkit-search-cancel-button { filter: grayscale(1); opacity: .6; }

  .seg { display: inline-flex; padding: 2px; gap: 2px; background: var(--surface-2); border: 1px solid var(--line-2); border-radius: var(--r2); height: var(--h-md); }
  .seg button { height: 100%; padding: 0 var(--s3); border: 1px solid transparent; border-radius: 6px; background: transparent; color: var(--ink-3); cursor: pointer;
    font-size: var(--t-sm); font-weight: 500; }
  .seg button:hover { color: var(--ink); }
  .seg button.on { background: var(--surface); color: var(--ink); border-color: var(--line-ctl); box-shadow: inset 0 -2px 0 var(--accent); }
  .seg button:focus-visible { outline-offset: 0; }

  /* ---------- Badges ---------- */
  .badge { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 var(--s2); border-radius: 999px; font-size: var(--t-xs); font-weight: 500;
    white-space: nowrap; border: 1px solid var(--neutral-bd); background: var(--neutral-bg); color: var(--ink-2); }
  .badge .i { width: 13px; height: 13px; stroke-width: 2; }
  .badge.good { color: var(--good); border-color: var(--good-bd); background: var(--good-bg); }
  .badge.warn { color: var(--warn); border-color: var(--warn-bd); background: var(--warn-bg); }
  .badge.bad { color: var(--bad); border-color: var(--bad-bd); background: var(--bad-bg); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }

  /* ---------- Layout ---------- */
  .wrap { max-width: 1200px; margin: 0 auto; padding: var(--s6) var(--s6) var(--s12); }
  @media (min-width: 1680px) { .wrap { max-width: 1360px; } }
  .card { background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r3); }
  main > * + * { margin-top: var(--s4); }

  /* Header */
  .top { display: flex; align-items: center; justify-content: space-between; gap: var(--s3) var(--s4); flex-wrap: wrap; margin-bottom: var(--s6); }
  .brand { display: flex; align-items: center; gap: var(--s3); flex: 1 1 0; min-width: 0; }
  .mark { display: grid; place-items: center; width: 36px; height: 36px; border-radius: var(--r2); background: var(--accent-soft); color: var(--accent); flex: none; }
  .mark .i { width: 20px; height: 20px; }
  h1 { font-size: var(--t-lg); font-weight: 600; letter-spacing: -.015em; line-height: 1.25; }
  .status { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: var(--t-xs); color: var(--ink-3); min-height: 18px; }
  .status .dot { color: var(--good); }
  .status.warn, .status.warn .dot { color: var(--warn); }
  .status.bad { color: var(--bad); }
  .status.idle .dot { color: var(--ink-3); }
  .status .i { width: 13px; height: 13px; }
  .status .meta { margin-right: var(--s2); }
  .status .fresh { display: inline-flex; align-items: center; gap: 6px; }
  .status .att { color: var(--warn); }
  .status .btn { height: 22px; padding: 0 var(--s2); font-size: var(--t-xs); margin-left: var(--s1); }
  .top-actions { display: flex; align-items: center; gap: var(--s2); flex: none; }
  .top-actions .sep { width: 1px; height: 20px; background: var(--line-2); margin: 0 var(--s1); }

  /* Notice */
  .notice { display: flex; gap: var(--s3); align-items: flex-start; padding: var(--s4) var(--s5); border-radius: var(--r3); border: 1px solid var(--line-2); background: var(--surface); }
  .notice.bad { border-color: var(--bad-bd); background: var(--bad-bg); }
  .notice.bad > .i { color: var(--bad); }
  .notice.info > .i { color: var(--ink-3); }
  .notice h2 { font-size: var(--t-md); font-weight: 600; }
  .notice p { color: var(--ink-2); margin-top: 2px; overflow-wrap: anywhere; }
  .notice .actions { display: flex; gap: var(--s2); margin-top: var(--s3); flex-wrap: wrap; }
  .notice.slim { padding: var(--s2) var(--s4); align-items: center; color: var(--ink-2); }

  /* Stat tiles */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(232px, 1fr)); gap: var(--s3); }
  .tile { position: relative; display: flex; flex-direction: column; gap: var(--s2); padding: var(--s4); background: var(--surface); border: 1px solid var(--line-2);
    border-radius: var(--r3); min-width: 0; }
  .tile.pick { cursor: pointer; }
  .tile.pick:hover { border-color: var(--line-ctl); }
  .tile.sel { border-color: var(--ink-3); }
  /* Tiles share row tracks (heading, number, bar, details, verdict), so sections line up across a row. */
  @supports (grid-template-rows: subgrid) {
    @media (min-width: 641px) {
      .tiles { grid-auto-rows: auto auto auto auto max-content; }
      .tile { display: grid; grid-row: span 5; grid-template-rows: subgrid; }
      .creds-tile > :last-child { grid-row: span 3; min-height: 0; align-self: start; }
      .verdict { align-self: start; }
    }
  }
  .tile-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); min-height: 28px; }
  .tile-head h3 { font-size: var(--t-md); font-weight: 600; color: var(--ink); min-width: 0; }
  /* The tile's one control. Its ::after stretches over the tile so a click anywhere picks the window. */
  .tile-btn { display: inline-flex; align-items: center; gap: var(--s1); height: var(--h-sm); padding: 0 var(--s2); flex: none; border: 1px solid var(--line-2); border-radius: var(--r2);
    background: transparent; color: var(--ink-2); font-size: var(--t-xs); font-weight: 500; cursor: pointer; white-space: nowrap; }
  .tile-btn .i { width: 14px; height: 14px; }
  .tile-btn::after { content: ""; position: absolute; inset: 0; border-radius: var(--r3); }
  .tile.pick:hover .tile-btn { color: var(--ink); border-color: var(--line-ctl); }
  .tile-btn[aria-pressed="true"], .tile.pick:hover .tile-btn[aria-pressed="true"] { color: var(--ink); border-color: transparent; background: var(--surface-3); }
  .tile-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  @supports selector(:has(*)) {
    .tile-btn:focus-visible { outline: none; }
    .tile:has(.tile-btn:focus-visible) { outline: 2px solid var(--focus); outline-offset: 2px; }
  }
  .tile-value { display: flex; align-items: baseline; gap: 6px; }
  .tile-value .big { font-size: var(--t-xl); font-weight: 600; letter-spacing: -.02em; line-height: 1.1; }
  .tile-value .unit { color: var(--ink-3); font-size: var(--t-sm); }
  .tile-value .big.muted { color: var(--ink-3); }
  .poolbar { height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
  .poolbar > i { display: block; height: 100%; background: var(--meter); border-radius: 3px; }
  .poolbar.warn > i { background: var(--warn-fill); }
  .poolbar.bad > i { background: var(--bad); }
  .poolbar.empty { background: var(--bad-bg); box-shadow: inset 0 0 0 1px var(--bad-bd); }
  .poolbar.empty > i { width: 3px !important; background: var(--bad); }
  .tile-sub { font-size: var(--t-sm); color: var(--ink-3); line-height: 1.45; overflow-wrap: anywhere; }
  .tile-sub + .tile-sub { margin-top: var(--s2); }
  .tile-sub b { color: var(--ink-2); font-weight: 500; }
  .verdict { display: flex; gap: var(--s2); align-items: flex-start; padding-top: var(--s1); }
  .verdict .i { margin-top: 2px; flex: none; }
  .verdict.warn, .verdict.bad { padding: var(--s2) var(--s3); border-radius: var(--r2); }
  .verdict.warn { background: var(--warn-bg); box-shadow: inset 0 0 0 1px var(--warn-bd); }
  .verdict.bad { background: var(--bad-bg); box-shadow: inset 0 0 0 1px var(--bad-bd); }
  .verdict.good .i { color: var(--good); }
  .verdict.bad .i { color: var(--bad); }
  .verdict.warn .i { color: var(--warn); }
  .verdict.neutral .i { color: var(--ink-3); }
  .verdict .v-main { font-size: var(--t-md); font-weight: 600; color: var(--ink); line-height: 1.4; }
  .verdict.good .v-main, .verdict.neutral .v-main { font-weight: 500; }
  .verdict .v-sub { font-size: var(--t-sm); color: var(--ink-2); margin-top: 2px; }
  .goto { all: unset; cursor: pointer; color: var(--ink-2); text-decoration: underline; text-decoration-color: var(--line-ctl); text-underline-offset: 2px; }
  .goto:hover { color: var(--ink); text-decoration-color: currentColor; }
  .goto:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 2px; }
  .probs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--s2); }
  .prob { display: flex; gap: var(--s2); align-items: flex-start; font-size: var(--t-sm); color: var(--ink-2); line-height: 1.45; min-width: 0; }
  .prob > .i { flex: none; width: 14px; height: 14px; margin-top: 2px; color: var(--ink-3); }
  .prob.bad > .i { color: var(--bad); }
  .prob.warn > .i { color: var(--warn); }
  .prob p { min-width: 0; overflow-wrap: anywhere; }
  .prob b { font-weight: 600; color: var(--ink); }
  .prob .goto { color: var(--ink); }
  .p-act { display: inline-flex; align-items: center; height: 22px; padding: 0 var(--s2); margin: 1px 0; vertical-align: baseline; border: 1px solid var(--line-ctl); border-radius: var(--r2);
    background: transparent; color: var(--ink-2); font: inherit; font-size: var(--t-xs); font-weight: 500; cursor: pointer; white-space: nowrap; }
  .p-act:hover { color: var(--ink); border-color: var(--ink-3); }
  .p-act[aria-disabled="true"] { opacity: .55; cursor: progress; }
  .p-act:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .all-ok { display: flex; gap: var(--s2); align-items: center; font-size: var(--t-sm); color: var(--ink-2); }
  .all-ok .i { width: 14px; height: 14px; color: var(--good); flex: none; }
  .tile-brief { display: none; }
  .cred-table.nospark th.sp, .cred-table.nospark td.sp { display: none; }
  .cred-table tbody tr.flash > * { background: var(--accent-soft) !important; }
  .skel { background: linear-gradient(90deg, var(--surface-2), var(--surface-3), var(--surface-2)); background-size: 200% 100%; border-radius: var(--r1); }
  @media (prefers-reduced-motion: no-preference) { .skel { animation: shimmer 1.4s ease-in-out infinite; } }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }

  /* Chart card */
  .card-head { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line); }
  .card-head .spacer { flex: 1; }
  .card-head h2 { font-size: var(--t-md); font-weight: 600; display: flex; align-items: baseline; gap: var(--s2); }
  .card-head h2 .count { font-size: var(--t-xs); color: var(--ink-3); font-weight: 400; }
  .settings { display: flex; gap: var(--s3) var(--s4); flex-wrap: wrap; align-items: center; padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line); background: var(--surface-2); }
  .settings .field { background: var(--surface); }
  .settings p { color: var(--ink-3); font-size: var(--t-xs); flex: 1 1 280px; }
  .settings p.rates { flex-basis: 100%; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .settings p.rates strong { color: var(--ink); font-weight: 600; }
  .settings p.rates .sec { color: var(--ink-3); }
  .chart-body { padding: var(--s3) var(--s4) var(--s4); }
  .legend { display: flex; gap: var(--s1) var(--s4); flex-wrap: wrap; font-size: var(--t-xs); color: var(--ink-2); min-height: 18px; align-items: center; }
  .key { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .k-line { width: 16px; height: 2px; background: var(--series); border-radius: 1px; }
  .k-dash { width: 16px; height: 0; border-top: 2px dashed var(--series); }
  .k-bar { width: 10px; height: 10px; background: var(--series-bar); border-radius: 2px 2px 0 0; }
  .k-ref { width: 16px; height: 0; border-top: 1px dashed var(--ink-2); }
  .k-empty { width: 16px; height: 3px; background: var(--bad); border-radius: 2px; }
  .chart { position: relative; height: 300px; margin-top: var(--s2); }
  .chart.is-empty { height: 240px; }
  .chart svg { display: block; width: 100%; height: 100%; overflow: visible; touch-action: pan-y; }
  .chart svg:focus-visible { outline-offset: 4px; border-radius: var(--r1); }
  .axis { fill: var(--ink-3); font-size: 12px; font-variant-numeric: tabular-nums; }
  .axis-lbl { fill: var(--ink-2); font-size: 12px; paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
  .now-pill { fill: var(--surface-3); }
  .now-txt { fill: var(--ink-2); font-size: 12px; font-weight: 500; }
  .out-pill { fill: var(--bad-bg); stroke: var(--bad-bd); stroke-width: 1; }
  .out-txt { fill: var(--bad); font-size: 12px; font-weight: 500; }
  .chart-msg { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: var(--s2);
    padding: var(--s4); color: var(--ink-2); }
  .chart-msg .i { color: var(--ink-3); }
  .chart-msg .msg-title { font-size: var(--t-md); font-weight: 600; color: var(--ink); max-width: 44ch; }
  .chart-msg .msg-body { max-width: 52ch; color: var(--ink-2); }
  .chart-msg .actions { display: flex; gap: var(--s2); flex-wrap: wrap; justify-content: center; margin-top: var(--s1); }
  .tooltip { position: absolute; z-index: 3; pointer-events: none; background: var(--surface-2); border: 1px solid var(--line-ctl); border-radius: var(--r2);
    padding: var(--s2) var(--s3); font-size: var(--t-xs); white-space: nowrap; box-shadow: var(--shadow); min-width: 140px; }
  .tooltip .tt-time { color: var(--ink-3); }
  .tooltip .tt-val { font-size: var(--t-md); font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
  .tooltip .tt-sub { color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .caption { margin-top: var(--s3); font-size: var(--t-xs); color: var(--ink-3); max-width: 100ch; }
  details.table-panel[open] { border-top: 1px solid var(--line); }
  details.table-panel > summary { display: none; }
  .table-scroll { max-height: 320px; overflow: auto; scrollbar-width: thin; scrollbar-color: var(--line-ctl) transparent; }
  table.data { width: 100%; border-collapse: collapse; font-size: var(--t-xs); font-variant-numeric: tabular-nums; }
  .table-cap { padding: var(--s3) var(--s4) var(--s2); font-size: var(--t-xs); color: var(--ink-3); }
  table.data th, table.data td { padding: 6px var(--s4); border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
  table.data thead th { position: sticky; top: 0; background: var(--surface); color: var(--ink-3); font-weight: 500; z-index: 1; }
  table.data th:first-child, table.data td:first-child { text-align: left; }
  table.data tbody th { text-align: left; color: var(--ink-2); font-weight: 600; background: var(--surface-2); }

  /* Credentials table */
  .creds .card-head { gap: var(--s2) var(--s3); }
  .cred-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: var(--t-sm); table-layout: fixed; }
  .cred-table thead th { position: sticky; top: 0; z-index: 2; background: var(--surface); text-align: left; font-size: var(--t-xs); font-weight: 500; color: var(--ink-3);
    padding: var(--s2) var(--s4); border-bottom: 1px solid var(--line-2); white-space: nowrap; letter-spacing: .01em; }
  .cred-table thead th.sel { color: var(--ink); }
  .cred-table thead th.sel span { box-shadow: inset 0 -2px 0 var(--accent); padding-bottom: 3px; }
  .cred-table td, .cred-table tbody th { padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line); vertical-align: top; text-align: left; font-weight: 400; }
  .cred-table tbody tr:last-child > * { border-bottom: 0; }
  .cred-table tbody tr:hover > * { background: var(--neutral-bg); }
  .cred-table tbody tr.off .who-name { color: var(--ink-2); }
  /* Set widths for the name, history and action columns; the window columns share the rest equally. */
  .cred-table thead th:first-child { width: 240px; }
  .cred-table th.sp { width: 200px; white-space: normal; }
  .cred-table th.act { width: 72px; }
  .cred-table th.act, .cred-table td.act { white-space: nowrap; text-align: right; }
  .who-name { font-size: var(--t-md); font-weight: 500; overflow-wrap: anywhere; line-height: 1.35; }
  /* A masked name stays on one line; the domain truncates before the name splits at "@". */
  .who-name.masked { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who-meta { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s1) var(--s2); color: var(--ink-3); font-size: var(--t-xs); margin-top: 2px; }
  .who-meta code { margin-right: var(--s1); }
  .who-meta .badge { height: 20px; }
  .who-err { display: flex; gap: 6px; align-items: flex-start; margin-top: var(--s1); font-size: var(--t-xs); color: var(--ink-2); max-width: 52ch; }
  .who-err .i { color: var(--warn); margin-top: 1px; width: 13px; height: 13px; }
  .who-err.bad .i { color: var(--bad); }
  .who-err span, .err-full { overflow-wrap: anywhere; }
  summary.who-err { cursor: pointer; }
  .who-err::-webkit-details-marker { display: none; }
  .who-err u { color: var(--ink); text-decoration-color: var(--line-ctl); text-underline-offset: 2px; }
  .err-full { margin: 2px 0 0 19px; max-width: 52ch; font-size: var(--t-xs); color: var(--ink-2); }
  .spark { display: block; width: 100%; height: 32px; overflow: visible; }
  .spark .sp-base { stroke: var(--line-2); stroke-width: 1; vector-effect: non-scaling-stroke; }
  .spark .sp-top { stroke: var(--grid); stroke-width: 1; stroke-dasharray: 2 3; vector-effect: non-scaling-stroke; }
  .spark .sp-area { fill: var(--series-band); }
  .spark .sp-line { fill: none; stroke: var(--series); stroke-width: 1.25; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
  .spark.off .sp-line { stroke: var(--ink-3); stroke-dasharray: 3 2; }
  .spark-cap { font-size: var(--t-xs); color: var(--ink-3); margin-top: 3px; line-height: 1.3; }
  .who-meta .spark-cap { display: none; margin: 0; }
  .cred-foot { display: flex; align-items: center; gap: var(--s2); padding: var(--s3) var(--s4); border-top: 1px solid var(--line); font-size: var(--t-xs); color: var(--ink-3); }
  .cred-foot[hidden] { display: none; }
  @media (min-width: 761px) { .foot-spark { display: none; } }
  .tick-key { flex: none; position: relative; width: 28px; height: 6px; border-radius: 3px; background: var(--track); }
  .tick-key::after { content: ''; position: absolute; left: 55%; top: -4px; bottom: -4px; width: 2px; border-radius: 1px; background: var(--ink-2); box-shadow: 0 0 0 1px var(--surface); }
  .m-top { display: flex; align-items: center; gap: var(--s2); }
  .m-val { font-weight: 600; min-width: 44px; font-variant-numeric: tabular-nums; }
  .m-val.muted, .m-val.off { color: var(--ink-3); font-weight: 500; }
  .bar { position: relative; flex: 1; height: 6px; border-radius: 3px; background: var(--track); min-width: 40px; }
  .bar > i { position: absolute; left: 0; top: 0; bottom: 0; max-width: 100%; border-radius: 3px; background: var(--meter); }
  .bar > b { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; border-radius: 1px; background: var(--ink-2); box-shadow: 0 0 0 1px var(--surface); }
  .bar.off { background: transparent; box-shadow: inset 0 0 0 1px var(--line-2); }
  .bar.off > i { background: repeating-linear-gradient(135deg, var(--muted-fill) 0 2px, transparent 2px 5px); box-shadow: inset 0 0 0 1px var(--muted-fill); }
  .m-tag { flex: none; font-size: var(--t-xs); font-weight: 500; color: var(--ink-2); }
  .m-tag.off { color: var(--ink-3); font-weight: 400; }
  .bar.warn > i { background: var(--warn-fill); }
  .bar.bad > i { background: var(--bad); }
  .bar.muted > i { background: var(--muted-fill); }
  .bar.empty { background: var(--bad-bg); box-shadow: inset 0 0 0 1px var(--bad-bd); }
  .bar.empty > i { width: 3px !important; background: var(--bad); }
  .m-when { font-size: var(--t-xs); color: var(--ink-3); margin-top: 3px; }
  .m-when b { color: var(--ink-2); font-weight: 500; }
  .m-na { font-size: var(--t-xs); color: var(--ink-3); }
  .m-label { display: none; }
  .act-wrap { display: inline-flex; align-items: center; gap: var(--s2); }
  .empty-row td { text-align: center; padding: var(--s8) var(--s4) !important; color: var(--ink-2); }
  .empty-row .actions { margin-top: var(--s3); display: flex; justify-content: center; gap: var(--s2); }
  .empty-row .msg-title { font-weight: 600; color: var(--ink); font-size: var(--t-md); }
  .skel-row td { padding: var(--s4); }

  /* Login */
  .login { min-height: 100vh; display: grid; place-items: center; padding: var(--s6) var(--s4); }
  .login-card { width: min(360px, 100%); padding: var(--s8); background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r3); display: flex; flex-direction: column; gap: var(--s2); }
  .login-brand { display: flex; align-items: center; gap: var(--s2); color: var(--ink-3); font-size: var(--t-xs); font-weight: 500; margin-bottom: var(--s2); }
  .login-brand .mark { width: 28px; height: 28px; }
  .login-brand .mark .i { width: 16px; height: 16px; }
  .login-card h1 { font-size: var(--t-lg); }
  .login-card .lead { color: var(--ink-2); margin-bottom: var(--s3); }
  .login-card label { font-size: var(--t-xs); font-weight: 500; color: var(--ink-2); }
  .login-card input { height: var(--h-lg); width: 100%; padding: 0 var(--s3); border: 1px solid var(--line-ctl); border-radius: var(--r2); background: var(--surface-2); font-size: var(--t-md); }
  .login-card input:focus-visible { outline-offset: 1px; }
  .login-card input[aria-invalid="true"] { border-color: var(--bad); }
  .field-error { display: flex; gap: 6px; align-items: flex-start; color: var(--bad); font-size: var(--t-xs); min-height: 18px; }
  .field-error:empty { min-height: 0; }
  .field-error .i { width: 14px; height: 14px; margin-top: 1px; }
  .help { color: var(--ink-3); font-size: var(--t-xs); }
  .login-card .btn { width: 100%; margin-top: var(--s2); }

  /* ---------- Responsive ---------- */
  @media (max-width: 1080px) {
    .cred-table thead th:first-child { width: 220px; }
    .cred-table th.sp { width: 160px; }
  }
  @media (min-width: 761px) and (max-width: 1080px) {
    .tiles.n4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    /* Three window columns need the room; the history sparkline returns on the cards below 760 px. */
    .cred-table.w3 th.sp, .cred-table.w3 td.sp { display: none; }
  }
  @media (min-width: 761px) and (max-width: 960px) {
    /* Two window columns need the room; the history sparkline returns on the cards below 760 px. */
    .cred-table th.sp, .cred-table td.sp { display: none; }
  }
  @media (max-width: 860px) {
    .wrap { padding: var(--s5) var(--s4) var(--s12); }
  }
  @media (max-width: 760px) {
    .cred-table thead { display: none; }
    .cred-table, .cred-table tbody { display: block; }
    .cred-table tbody tr { display: flex; flex-wrap: wrap; gap: var(--s3) var(--s4); padding: var(--s4); border-bottom: 1px solid var(--line); }
    .cred-table tbody tr:last-child { border-bottom: 0; }
    .cred-table tbody tr:hover > * { background: transparent; }
    .cred-table td, .cred-table tbody th { display: block; padding: 0; border: 0; width: auto !important; }
    /* Name, sparkline and refresh share the first line; then one line per window, so bars line up down the list. */
    .cred-table .who { flex: 1 1 0; min-width: 0; order: 1; }
    .cred-table td.sp { flex: 0 1 25%; max-width: 120px; min-width: 64px; order: 2; }
    .cred-table td.act { flex: none; order: 3; }
    .cred-table td.sp .m-label, .cred-table td.sp.none, .spark-wrap .spark-cap { display: none; }
    /* On cards the caption moves under the name, so every sparkline keeps one width. */
    .who-meta .spark-cap { display: block; }
    .spark-wrap .spark { height: 24px; }
    .cred-table td.mc { flex: 1 1 100%; order: 4; display: grid; grid-template-columns: 84px minmax(0, 1fr); column-gap: var(--s3); align-items: center; }
    .cred-table td.mc .m-when { grid-column: 2; margin-top: 0; }
    .m-label { display: block; font-size: var(--t-xs); color: var(--ink-3); }
    .top-actions .lbl, .chart-card .card-head .field > span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .top-actions .btn.ghost, .top-actions .btn.tog { width: var(--h-md); padding: 0; }
    .top-actions .sep { display: none; }
    .chart-card .card-head { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)) auto auto; }
    .chart-card .card-head .seg { grid-column: 1 / 5; }
    .chart-card .card-head .field { grid-row: 2; grid-column: span 3; }
    .chart-card .card-head .seg button { flex: 1; }
    .chart-card .card-head .spacer { display: none; }
    .chart-card .card-head .field select { flex: 1; padding-left: var(--s3); }
    .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    /* Credentials is always the last tile; on an odd slot it takes the whole row instead of sitting alone. */
    .tiles > .creds-tile:nth-child(odd) { grid-column: 1 / -1; }
    .m-label.sel { color: var(--ink); font-weight: 500; }
    .empty-row td { flex: 1 1 100%; }
    .cred-table td.m-na { flex: 1 1 100%; order: 4; }
    /* Disabled rows: the badge already says the values are last known. */
    .cred-table tr.off td.mc .m-when { display: none; }
  }
  @media (min-width: 641px) and (max-width: 760px) {
    .cred-table td.mc { grid-template-columns: 84px minmax(0, 1fr) 248px; }
    .cred-table td.mc .m-when { grid-area: 1 / 3; }
  }
  @media (max-width: 640px) {
    .top { margin-bottom: var(--s4); }
    .brand { flex: 1 1 100%; }
    .top-actions { flex: 1 1 100%; justify-content: flex-start; }
    .top-actions #refresh-all-btn { margin-left: auto; }
    .tiles, .tiles.n4 { grid-template-columns: 1fr; gap: var(--s2); }
    .tile { padding: var(--s3) var(--s4); }
    /* Phones: the most urgent window keeps its full tile; the others fold to one line. */
    .tile.pick:not(.lead) { padding: var(--s2) var(--s3); gap: 0; }
    .tile.pick:not(.lead) > :not(.tile-head) { display: none; }
    .tile.pick:not(.lead) .tile-head h3 { flex: none; }
    .tile.pick:not(.lead) .tile-brief { display: block; flex: 1; min-width: 0; font-size: var(--t-sm); color: var(--ink-2); line-height: 1.4; }
    .tile-brief b { color: var(--ink); font-weight: 600; }
    .tile-brief .vk .i { width: 13px; height: 13px; margin-right: 3px; vertical-align: -2px; color: var(--ink-3); }
    .tile-brief .vk.good .i { color: var(--good); }
    .tile-brief .vk.warn .i { color: var(--warn); }
    .tile-brief .vk.bad .i { color: var(--bad); }
    .tile.pick:not(.lead) .tile-btn { width: var(--h-sm); padding: 0; justify-content: center; }
    .tile.pick:not(.lead) .tile-btn .bt, .creds .card-head .field > span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    /* The header meta carries the credential count, so the tile only lists problems. */
    .creds-tile .tile-value { display: none; }
    .creds-tile.ok { display: none; }
    .creds-tile .tile-head { min-height: 0; }
    .chart { height: 260px; }
    .chart.is-empty { height: 200px; }
    .chart-body { padding: var(--s3); }
    .card-head { padding: var(--s3); }
    .creds .card-head h2 { flex: 1 1 100%; }
    .creds .card-head .spacer { display: none; }
    .creds .search { max-width: none; flex: 1 1 0; }
    .creds .card-head .field { flex: 0 0 124px; padding-left: 0; }
    .creds .card-head .field select { flex: 1; min-width: 0; }
    .cred-table tbody tr { padding: var(--s3); gap: var(--s3); }
    table.data th, table.data td { padding: 6px var(--s2); }
  }
  /* The sparkline gives up width first, so a masked name fits on its line. */
  @media (max-width: 400px) { .cred-table td.sp { flex-basis: 16%; min-width: 48px; } }
  @media (pointer: coarse) {
    .btn, .field, .search, .seg { min-height: 40px; }
    .btn.icon, .top-actions .btn { min-width: 40px; }
    /* Tile actions get their own 40 px line; the 12 px gaps keep them clear of the name links' 11 px hit bands. */
    .probs { gap: var(--s3); }
    .p-act { display: flex; width: max-content; min-height: 40px; padding: 0 var(--s3); margin-top: var(--s3); }
    .goto { display: inline-block; padding: 11px 2px; margin: -11px -2px; position: relative; z-index: 1; }
    summary.who-err { padding-block: 11px; margin: 0 0 -11px; }
    details[open] > summary.who-err { margin-bottom: 0; }
    .seg { height: auto; }
    .seg button { min-height: 40px; }
  }
  @media (forced-colors: active) {
    .bar { border: 1px solid CanvasText; }
    .bar > i, .poolbar > i, .k-line, .k-bar, .dot, .k-empty { background: Highlight; forced-color-adjust: none; }
    .seg button.on { border-color: Highlight; }
    .tile.sel { border-color: Highlight; }
  }
</style>
</head>

<div id="login" class="login" hidden>
  <form id="login-form" class="login-card" novalidate>
    <div class="login-brand"><span class="mark"><svg aria-hidden="true" class="i"><use href="#i-gauge"/></svg></span>CLIProxyAPI</div>
    <h1>Quota Management</h1>
    <p class="lead">Sign in with the proxy's management key.</p>
    <label for="key-input">Management key</label>
    <input id="key-input" type="password" autocomplete="current-password" spellcheck="false" aria-describedby="login-error login-help">
    <p id="login-error" class="field-error" role="alert"></p>
    <p id="login-help" class="help">The remote-management secret key from the proxy's config.yaml.</p>
    <button class="btn primary lg" type="submit" id="login-submit">Continue</button>
  </form>
</div>

<div id="app" class="wrap" hidden>
  <header class="top">
    <div class="brand">
      <span class="mark" aria-hidden="true"><svg aria-hidden="true" class="i"><use href="#i-gauge"/></svg></span>
      <div style="min-width:0">
        <h1>Quota Management</h1>
        <p class="status" id="status" role="status" aria-live="polite" title="Reloads every minute"></p>

    </div>
    <div class="top-actions">
      <button class="btn ghost tog" id="emails-btn" type="button" aria-pressed="false"><svg aria-hidden="true" class="i"><use href="#i-eye"/></svg><span class="lbl">Show emails</span></button>
      <button class="btn ghost icon" id="theme-btn" type="button" aria-label="Switch to light theme" title="Switch to light theme"><svg aria-hidden="true" class="i"><use href="#i-sun"/></svg></button>
      <span class="sep" aria-hidden="true"></span>
      <button class="btn" id="refresh-all-btn" type="button"><svg aria-hidden="true" class="i spin"><use href="#i-refresh"/></svg><span>Refresh all</span></button>
      <button class="btn ghost tog" id="logout-btn" type="button" title="Forget the stored key on this device"><svg aria-hidden="true" class="i"><use href="#i-logout"/></svg><span class="lbl">Sign out</span></button>
    </div>
  </header>

  <main>
    <div id="notice" hidden></div>

    <section aria-labelledby="h-pool">

      <div class="tiles" id="tiles"></div>

      <div class="card-head">
        <div class="seg" role="group" aria-label="Chart view">
          <button type="button" data-tab="remaining" class="on" aria-pressed="true">Remaining</button>
          <button type="button" data-tab="drain" aria-pressed="false">Drain rate</button>
        </div>
        <span class="spacer"></span>

          <select id="window-select">

        <button class="btn ghost icon" id="table-btn" type="button" aria-expanded="false" aria-controls="table-panel" aria-label="Show data table" title="Data table"><svg aria-hidden="true" class="i"><use href="#i-table"/></svg></button>
      </div>
      <div class="settings" id="settings" hidden>

            <option value="6">6 hours</option>
            <option value="24">24 hours</option>
            <option value="72">3 days</option>
            <option value="168">7 days</option>
          </select><svg aria-hidden="true" class="i sm chev"><use href="#i-chev"/></svg>

            <option value="expiring">Soonest reset first</option>

    <section class="card creds" aria-labelledby="h-creds">

        <label class="search"><svg aria-hidden="true" class="i"><use href="#i-search"/></svg><span class="sr-only">Search credentials</span>
          <input id="search" type="search" placeholder="Name or email" autocomplete="off" spellcheck="false"></label>
        <label class="field"><span>Sort</span>
          <select id="sort-select">
            <option value="default">Name</option>
            <option value="reset">Soonest reset</option>
            <option value="remaining">Most remaining</option>

</div>

<script>
(() => {
  'use strict';
  const KEY_STORE = 'cpa-quota-key';
  const PREFS_STORE = 'cpa-quota-prefs';
  const MIN = 60e3, HOUR = 3600e3, DAY = 24 * HOUR;
  const WINDOWS = {
    five_hour: { label: '5-hour', period: 5 * HOUR },
    seven_day: { label: '7-day', period: 168 * HOUR },
    fable: { label: '7-day Fable', period: 168 * HOUR },
  };
  const WIN_ORDER = ['five_hour', 'seven_day', 'fable'];
  const FALLBACK_ORDER = ['fable', 'five_hour', 'seven_day'];
  const LOOKBACKS = [6, 24, 72, 168];
  const LOOKBACK_LABEL = { 6: '6 h', 24: '24 h', 72: '3 days', 168: '7 days' };
  // Verdicts name a lookback as a pace: "at the last 6 hours' pace", "at the 24-hour pace".
  const PACE = { 6: "last 6 hours'", 24: '24-hour', 72: '3-day', 168: '7-day' };
  const $ = (id) => document.getElementById(id);
  const icon = (name, cls = '') => `<svg class="i ${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;

  // ---------- Prefs ----------
  const DEFAULTS = { window: null, horizon: 7, lookback: 24, order: 'expiring', theme: null, emails: false, sort: 'default', tab: 'remaining' };
  const VALID = {
    window: Object.keys(WINDOWS), horizon: [1, 3, 7, 14], lookback: LOOKBACKS, order: ['expiring', 'even'],
    theme: ['dark', 'light'], emails: [true, false], sort: ['default', 'reset', 'remaining', 'least'], tab: ['remaining', 'drain'],
  };
  const NUMERIC = new Set(['horizon', 'lookback']);
  let stored = {};
  try { stored = JSON.parse(localStorage.getItem(PREFS_STORE) || '{}'); } catch { stored = {}; }
  if (!stored || typeof stored !== 'object' || Array.isArray(stored)) stored = {};
  const prefs = {};
  for (const k of Object.keys(DEFAULTS)) {
    let v = stored[k];
    if (NUMERIC.has(k) && v !== undefined && v !== null) v = Number(v);
    if (k === 'emails' && typeof v === 'string') v = v === 'true';
    prefs[k] = VALID[k].includes(v) ? v : DEFAULTS[k];
  }
  if (!prefs.theme) prefs.theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  // Unknown keys in the stored object are kept; only keys the user sets are written.
  // Until the user picks a range, 5-hour charts 1 day and the weekly windows 7 days.
  let horizonSet = VALID.horizon.includes(Number(stored.horizon));
  const horizonFor = (w) => (horizonSet ? prefs.horizon : w === 'five_hour' ? 1 : DEFAULTS.horizon);
  function setPref(key, value) {
    if (key === 'horizon') horizonSet = true;
    prefs[key] = value;
    stored[key] = value;
    try { localStorage.setItem(PREFS_STORE, JSON.stringify(stored)); } catch {}
  }

  // ---------- State ----------
  let data = null;          // last good payload
  let P = null;             // prepared data
  let dataVersion = 0;
  let modelCache = new Map();
  let lastOkAt = 0;
  let loadError = null;     // { message, at }
  let loading = false;
  let busyAll = false;
  const busyRows = new Set();
  const rowErrors = new Map();
  const openErrs = new Set();
  let flash = null;         // { text, kind, until }
  let windowChosen = false; // the user picked a window in this session
  let autoWindow = null;    // first-visit pick, frozen for the session
  let chartPoints = null;   // hover / keyboard state
  let chartIndex = -1;
  let liveTimer;            // screen-reader copy of the chart readout

  // ---------- API ----------
  async function api(path, opts = {}) {
    const key = localStorage.getItem(KEY_STORE) || '';
    let res;
    try {
      res = await fetch('/v8/management' + path, {
        ...opts,
        headers: { 'Authorization': 'Bearer ' + key, 'Content-Type': 'application/json', ...(opts.headers || {}) },
      });
    } catch (err) {
      throw new Error("can't reach the proxy (" + (err && err.message ? err.message : 'network error') + ')');
    }
    if (res.status === 401 || res.status === 403) { const err = new Error('HTTP ' + res.status); err.auth = true; err.status = res.status; throw err; }
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      const err = new Error(body.error ? body.error + ' (HTTP ' + res.status + ')' : 'HTTP ' + res.status);
      err.status = res.status;
      throw err;
    }
    return res.json();
  }

  function setData(d) {
    data = d;
    P = prepare(d);
    dataVersion++;
    modelCache = new Map();
    lastOkAt = Date.now();
    loadError = null;
  }

  // A payload is applied only when the server built it after the one shown (same server time: sent later).
  // Parallel row refreshes answer in any order, so send order alone would drop newer data.
  // Sign-out bumps epoch, which drops every response still in flight.
  let reqSeq = 0, appliedSeq = 0, epoch = 0;
  const newer = (d, seq) => { const t = parseT(d.now); return !P || (t === P.now ? seq > appliedSeq : t > P.now || isNaN(t)); };
  async function load() {
    const seq = ++reqSeq, e = epoch;
    loading = true;
    if (!$('app').hidden) renderStatus();
    try {
      const d = await api('/quota/history');
      if (e !== epoch || !newer(d, seq)) return;
      appliedSeq = seq;
      setData(d);
      loading = false;
      showApp();
      render();
    } catch (err) {
      if (e !== epoch || seq < appliedSeq) return;
      loading = false;
      if (err.auth) return showLogin(localStorage.getItem(KEY_STORE) ? rejectMessage(err) : '');
      loadError = { message: err.message, at: Date.now() };
      if (!$('login').hidden) { setLoginError("Couldn't load quota history: " + err.message + '.'); return; }
      showApp();
      render();
    }
  }

  async function refresh(authIndex) {
    if (authIndex ? busyRows.has(authIndex) || busyAll : busyAll) return;
    if (authIndex) { busyRows.add(authIndex); rowErrors.delete(authIndex); } else busyAll = true;
    renderBusy();
    renderStatus();
    const seq = ++reqSeq, e = epoch;
    try {
      const d = await api('/quota/history/refresh', { method: 'POST', body: JSON.stringify(authIndex ? { auth_index: authIndex } : {}) });
      if (e !== epoch) return;
      if (newer(d, seq)) { appliedSeq = seq; setData(d); }
      if (authIndex) {
        const c = data.credentials.find((x) => x.auth_index === authIndex);
        setFlash('Refreshed ' + (c ? displayName(c) : 'credential') + ' at ' + fmtClock(Date.now()), 'ok', 8000);
      } else {
        rowErrors.clear();
        const n = data.credentials.filter((c) => !c.disabled).length;
        setFlash('Refreshed ' + plural(n, 'credential') + ' at ' + fmtClock(Date.now()), 'ok', 8000);
      }
    } catch (err) {
      if (e !== epoch) return;
      if (authIndex) busyRows.delete(authIndex); else busyAll = false;
      if (err.auth) return showLogin(rejectMessage(err));
      if (authIndex) rowErrors.set(authIndex, 'Refresh failed: ' + err.message);
      else setFlash('Refresh failed: ' + err.message, 'bad', 15000);
    }
    if (authIndex) busyRows.delete(authIndex); else busyAll = false;
    if (!$('app').hidden) render();
  }

  async function resetCooldown(authIndex) {
    if (busyRows.has(authIndex)) return;
    busyRows.add(authIndex);
    rowErrors.delete(authIndex);
    renderBusy();
    const e = epoch;
    try {
      await api('/routing/cooldown/reset', { method: 'POST', body: JSON.stringify({ auth_index: authIndex }) });
      if (e !== epoch) return;
      busyRows.delete(authIndex);
      const c = data && data.credentials.find((x) => x.auth_index === authIndex);
      setFlash('Cleared the cooldown on ' + (c ? displayName(c) : 'credential'), 'ok', 8000);
      await load();
    } catch (err) {
      if (e !== epoch) return;
      busyRows.delete(authIndex);
      if (err.auth) return showLogin(rejectMessage(err));
      rowErrors.set(authIndex, "Couldn't clear the cooldown: " + err.message);
      render();
    }
  }

  function setFlash(text, kind, ms) {
    flash = { text, kind, until: Date.now() + ms };
    setTimeout(() => { if (data && !$('app').hidden) renderStatus(); }, ms + 50);
  }

  const rejectMessage = (err) => 'That key was rejected (' + (err.status || 401) + '). Check the key and try again.';

  function setLoginError(message) {
    const el = $('login-error');
    el.innerHTML = message ? icon('alert') + '<span>' + esc(message) + '</span>' : '';
    $('key-input').setAttribute('aria-invalid', message ? 'true' : 'false');
  }
  function showLogin(message) {
    // Drop responses still in flight and clear the hidden dashboard, so no names stay in the page.
    epoch++;
    data = P = loadError = flash = null;
    modelCache = new Map();
    loading = busyAll = false;
    busyRows.clear();
    rowErrors.clear();
    render();
    $('app').hidden = true;
    $('login').hidden = false;
    setLoginBusy(false);
    setLoginError(message || '');
    $('key-input').focus();
  }
  function showApp() { $('login').hidden = true; $('app').hidden = false; }
  function setLoginBusy(on) {
    const b = $('login-submit');
    b.setAttribute('aria-disabled', on ? 'true' : 'false');
    b.textContent = on ? 'Checking…' : 'Continue';
  }

  // ---------- Model ----------
  const clampPct = (v) => Math.max(0, Math.min(100, v));
  const parseT = (s) => (s ? Date.parse(s) : NaN);
  const remainingOf = (win, at) => {
    if (!win) return null;
    const reset = parseT(win.resets_at);
    if (!isNaN(reset) && reset <= at) return 100;
    const p = Number(win.percent);
    return clampPct(100 - (isFinite(p) ? p : 0));
  };
  const usageOf = (c, w) => (c && c.status && c.status.usage ? c.status.usage[w] || null : null);

  function prepare(d) {
    const creds = Array.isArray(d.credentials) ? d.credentials : [];
    const samples = (Array.isArray(d.samples) ? d.samples : []).map((s) => ({ s, t: parseT(s.t) })).filter((x) => !isNaN(x.t)).sort((a, b) => a.t - b.t);
    const now = isNaN(parseT(d.now)) ? Date.now() : parseT(d.now);
    const active = creds.filter((c) => !c.disabled);
    const statusWin = WIN_ORDER.filter((w) => active.some((c) => usageOf(c, w)));
    const columnWin = WIN_ORDER.filter((w) => creds.some((c) => usageOf(c, w)));
    const sampleWin = WIN_ORDER.filter((w) => samples.some((x) => x.s[w]));
    const anyWin = WIN_ORDER.filter((w) => statusWin.includes(w) || sampleWin.includes(w));
    const newest = samples.length ? samples[samples.length - 1].t : null;
    const interval = (Number(d.interval_seconds) || 600) * 1000;
    const byId = new Map();
    for (const x of samples) { if (!byId.has(x.s.id)) byId.set(x.s.id, []); byId.get(x.s.id).push(x); }
    return { creds, samples, byId, now, statusWin, columnWin, anyWin, newest, interval, ...identities(creds) };
  }

  function model(w) {
    const key = [dataVersion, w, prefs.lookback, horizonFor(w), prefs.order].join('|');
    if (!modelCache.has(key)) modelCache.set(key, buildModel(w));
    return modelCache.get(key);
  }

  function buildModel(w) {
    const now = P.now;
    const period = WINDOWS[w].period;
    const active = P.creds.filter((c) => !c.disabled);
    const activeIds = new Set(active.map((c) => c.id));

    // Current pool: active credentials that report this window now.
    const pool = [];
    for (const c of active) {
      const win = usageOf(c, w);
      if (!win) continue;
      const reset = parseT(win.resets_at);
      pool.push({ c, rem: remainingOf(win, now), assumed: isAssumed(credState(c), win, now), reset: isNaN(reset) ? null : (reset <= now ? reset + period * Math.ceil((now - reset) / period) : reset) });
    }
    const capacity = pool.length * 100;
    const remaining = pool.reduce((s, p) => s + p.rem, 0);
    const notReporting = active.length - pool.length;

    // History: pool total after each sampling round, carrying each credential's last value forward.
    // A credential whose sample stops carrying this window leaves the sum, as it has left the current pool.
    const last = new Map();
    const history = [];
    const consumption = [];
    let total = 0, firstT = null, count = 0;
    const push = (t) => {
      const point = { t, v: total, cap: last.size * 100 };
      if (history.length && t - history[history.length - 1].t < 120e3) history[history.length - 1] = point;
      else history.push(point);
    };
    for (const { s, t } of P.samples) {
      if (!activeIds.has(s.id)) continue;
      const win = s[w];
      const prev = last.get(s.id);
      if (!win) {
        if (prev) { total -= prev.rem; last.delete(s.id); push(t); }
        continue;
      }
      count++;
      if (firstT === null) firstT = t;
      const rem = remainingOf(win, t);
      if (prev && rem < prev.rem && sameWindow(prev.win, win)) consumption.push({ t, amount: prev.rem - rem, id: s.id });
      total += rem - (prev ? prev.rem : 0);
      last.set(s.id, { rem, win });
      push(t);
    }
    if (pool.length) history.push({ t: now, v: remaining, cap: capacity });

    // Drain rate over each lookback, scaled to the span of data actually available.
    const rateFor = (hours) => {
      const start = now - hours * HOUR;
      const spanHours = Math.max(1, (now - Math.max(start, firstT === null ? now : firstT)) / HOUR);
      let used = 0;
      for (const c of consumption) if (c.t >= start) used += c.amount;
      return count > 1 ? used / spanHours : 0;
    };
    const rates = {};
    for (const h of LOOKBACKS) rates[h] = rateFor(h);
    const rate = rates[prefs.lookback];
    // Use inside the chosen lookback by credentials that are no longer in the pool (they still count in the rate).
    const poolIds = new Set(pool.map((p) => p.c.id));
    const leftIds = new Set();
    for (const c of consumption) if (c.t >= now - prefs.lookback * HOUR && !poolIds.has(c.id)) leftIds.add(c.id);
    const span = firstT === null ? 0 : now - firstT;
    const forecastable = pool.length > 0 && span >= HOUR;

    const end = now + horizonFor(w) * DAY;
    const sim = simulate(pool, rate, period, now, end, prefs.order);
    // The fastest measured rate, when it runs out and the chosen one does not, or runs out much sooner.
    // It backs the amber "could run out" verdict and the warning line in a red one.
    let fast = null;
    if (forecastable) {
      let hiH = null;
      for (const h of LOOKBACKS) if (rates[h] > rate + 0.05 && (hiH === null || rates[h] > rates[hiH])) hiH = h;
      if (hiH !== null) {
        const fs = simulate(pool, rates[hiH], period, now, end, prefs.order);
        if (fs.runout !== null && (sim.runout === null || fs.runout < sim.runout - Math.max(HOUR, (sim.runout - now) / 4))) fast = { runout: fs.runout, lookback: hiH };
      }
    }

    // A green forecast must not rest on assumed resets alone: run the pool again without them.
    let unsure = null;
    const assumed = pool.filter((p) => p.assumed);
    if (forecastable && assumed.length && sim.runout === null && !fast) {
      const rest = pool.filter((p) => !p.assumed);
      // With every member assumed there is nothing measured to forecast from (runout stays null).
      const runout = rest.length ? simulate(rest, rate, period, now, end, prefs.order).runout : null;
      if (runout !== null || !rest.length) unsure = { runout, members: assumed };
    }

    // Next reset from the credentials' own reset times, independent of the horizon. One at 100% gains nothing.
    const upcoming = pool.filter((p) => p.reset !== null && p.reset > now && p.rem < 99.5).sort((a, b) => a.reset - b.reset);
    let nextReset = null;
    if (upcoming.length) {
      const t = upcoming[0].reset;
      // The step the forecast draws at this reset, so tile, chart and table agree; current state without a forecast.
      const gains = forecastable && t <= end ? sim.gains.filter((g) => g.t >= t && g.t - t < 60e3) : upcoming.filter((p) => p.reset - t < 60e3).map((p) => ({ v: 100 - p.rem }));
      nextReset = { t, adds: gains.reduce((sum, g) => sum + g.v, 0) / capacity * 100 };
    }
    return {
      w, now, period, capacity, remaining, share: capacity ? remaining / capacity * 100 : null,
      poolSize: pool.length, pool, notReporting, history, consumption, rate, rates, span, forecastable, leftCount: leftIds.size,
      projection: sim.points, runout: sim.runout, fast, unsure, nextReset, count,
    };
  }

  function simulate(pool, rate, period, now, end, order) {
    const sim = pool.map((p) => ({ rem: p.rem, reset: p.reset }));
    const step = Math.min(10 * MIN, period / 30);
    const points = [], gains = [];
    let runout = null;
    for (let t = now; t <= end; t += step) {
      // rs: the latest reset inside this step, so an empty stretch ends at the reset, not the step after it.
      let rs = null;
      for (const p of sim) {
        while (p.reset !== null && p.reset <= t) { gains.push({ t: p.reset, v: 100 - p.rem }); p.rem = 100; rs = Math.max(rs ?? 0, p.reset); p.reset += period; }
      }
      if (t > now) drain(sim, rate * step / HOUR, order);
      let total = 0;
      for (const p of sim) total += p.rem;
      if (runout === null && total < 0.5 && rate > 0 && sim.length) runout = t;
      points.push({ t, v: total, rs });
    }
    return { points, runout, gains };
  }

  function sameWindow(a, b) {
    if (!a.resets_at || !b.resets_at) return true;
    return Math.abs(parseT(a.resets_at) - parseT(b.resets_at)) < 30 * 60e3;
  }

  function drain(sim, amount, order) {
    if (order === 'even') {
      let left = amount;
      for (let pass = 0; pass < 4 && left > 1e-9; pass++) {
        const live = sim.filter((p) => p.rem > 0);
        if (!live.length) return;
        const share = left / live.length;
        left = 0;
        for (const p of live) { const take = Math.min(p.rem, share); p.rem -= take; left += share - take; }
      }
      return;
    }
    const queue = sim.filter((p) => p.rem > 0).sort((a, b) => (a.reset ?? Infinity) - (b.reset ?? Infinity));
    for (const p of queue) {
      if (amount <= 0) return;
      const take = Math.min(p.rem, amount);
      p.rem -= take;
      amount -= take;
    }
  }

  // Which window to show: the user's choice, else the window that runs out first.
  function currentWindow() {
    if (!P) return prefs.window || 'fable';
    const has = (w) => P.statusWin.includes(w) || P.anyWin.includes(w);
    if (prefs.window && (windowChosen || has(prefs.window) || !P.anyWin.length)) return prefs.window;
    if (!autoWindow || !has(autoWindow)) autoWindow = pickWindow();
    return autoWindow || prefs.window || 'fable';
  }
  function pickWindow() {
    const cands = P.statusWin.length ? P.statusWin : P.anyWin;
    if (!cands.length) return FALLBACK_ORDER[0];
    const ms = cands.map((w) => model(w));
    const running = ms.filter((m) => m.forecastable && m.runout !== null).sort((a, b) => a.runout - b.runout);
    if (running.length) return running[0].w;
    const withShare = ms.filter((m) => m.share !== null).sort((a, b) => a.share - b.share);
    if (withShare.length) return withShare[0].w;
    return FALLBACK_ORDER.find((w) => cands.includes(w)) || cands[0];
  }

  // ---------- Credential state ----------
  function credState(c) {
    const now = P.now;
    const st = c.status || {};
    const usage = st.usage || {};
    const fetched = parseT(st.fetched_at);
    const cool = parseT(c.cooldown_until);
    const hasUsage = Object.keys(usage).some((k) => usage[k]);
    const age = isNaN(fetched) ? null : now - fetched;
    return {
      disabled: !!c.disabled,
      cooldown: !isNaN(cool) && cool > now ? { left: cool - now, until: cool } : null,
      never: isNaN(fetched) && !hasUsage,
      error: st.error ? { text: String(st.error), headers: /headers/.test(String(st.source || '')) } : null,
      stale: age !== null && age > 3 * P.interval ? age : null,
      fetched: isNaN(fetched) ? null : fetched,
      source: st.source || '',
    };
  }
  const isMuted = (s) => s.disabled || (s.error && !s.error.headers && s.stale);
  // A window whose reset passed while the usage fetch fails: its 100% is assumed, not measured.
  const isAssumed = (s, win, at) => !!(s.error && !s.error.headers && win && parseT(win.resets_at) <= at);

  // ---------- Formatting ----------
  const pct = (v) => Math.round(v) + '%';
  const fmtPct1 = (r) => (r > 0 && r < 0.05 ? 'less than 0.1' : r >= 10 ? Math.round(r) : r.toFixed(1)) + '%';
  // Rates are per account (sum of each credential's % used per hour); readers get them as pool share.
  const poolRate = (m, r = m.rate) => (m.poolSize ? r / m.poolSize : 0);
  const fmtRate = (m, r) => fmtPct1(poolRate(m, r)) + ' of the pool per hour';
  // Time phrases use no-break spaces so "10:52 AM", "Sun 2:20 AM" and "in 5d 16h" never split.
  const NB = '\u00a0';
  const nb = (t) => String(t).replace(/[ \u202f]/g, NB);
  const fmtClock = (t) => nb(new Date(t).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }));
  const fmtDateTime = (t) => nb(new Date(t).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }));
  function fmtDur(ms) {
    const m = Math.floor(Math.abs(ms) / MIN);
    if (m < 1) return 'under' + NB + '1m';
    if (m < 60) return m + 'm';
    const h = Math.floor(m / 60), mm = m % 60;
    if (h < 24) return mm ? h + 'h' + NB + mm + 'm' : h + 'h';
    const d = Math.floor(h / 24), hh = h % 24;
    return hh ? d + 'd' + NB + hh + 'h' : d + 'd';
  }
  const startOfDay = (t) => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
  // "today 11:28 AM", "tomorrow 1:30 AM", "Tue 1:30 AM", "Nov 3, 9:00 AM". short drops "today".
  function fmtWhen(t, short) {
    const now = P ? P.now : Date.now();
    const days = Math.round((startOfDay(t) - startOfDay(now)) / DAY);
    const time = fmtClock(t);
    if (days === 0) return short ? time : 'today' + NB + time;
    if (days === 1) return 'tomorrow' + NB + time;
    if (days === -1) return 'yesterday' + NB + time;
    if (days > 1 && days < 7) return new Date(t).toLocaleDateString(undefined, { weekday: 'short' }) + NB + time;
    return fmtDateTime(t);
  }
  const fmtAccounts = (units) => (units >= 10 ? Math.round(units) : (Math.round(units * 10) / 10).toFixed(1).replace(/\.0$/, ''));
  const plural = (n, one, many) => n + ' ' + (n === 1 ? one : (many || one + 's'));
  const horizonText = (d) => (d === 1 ? '24 hours' : d + ' days');
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  function maskEmail(email) {
    if (!email) return '';
    if (prefs.emails) return email;
    return (P && P.masks.get(email)) || mask(email);
  }
  const mask = (email, more) => {
    const [user = '', domain] = String(email).split('@');
    return user.slice(0, 2) + '***' + (more && user.length > 4 ? user.slice(-2) : '') + (domain ? '@' + domain : '');
  };
  // Masked names must tell credentials apart. When two masks match, they show the last 2 letters too.
  // The row code is the name's hex, or the start of auth_index when name and hex both repeat. Rows show it
  // only when masked names match; otherwise it tells nothing apart (live, five credentials share one hex).
  // Names that still match (the same email twice) carry their code wherever they appear alone.
  function identities(creds) {
    const emails = [...new Set(creds.map((c) => c.email).filter(Boolean))];
    const masks = new Map(emails.map((e) => [e, mask(e, emails.some((o) => o !== e && mask(o) === mask(e)))]));
    const label = (c) => (c.email ? masks.get(c.email) : c.name || c.id || '');
    const count = (f) => { const n = new Map(); for (const c of creds) n.set(f(c), (n.get(f(c)) || 0) + 1); return n; };
    const labels = count(label), pairs = count((c) => label(c) + ' ' + hexId(c));
    const codes = new Map(creds.map((c) => [c, pairs.get(label(c) + ' ' + hexId(c)) > 1 || !hexId(c) ? String(c.auth_index || '').slice(0, 8) : hexId(c)]));
    return { masks, codes, dups: new Set(creds.filter((c) => labels.get(label(c)) > 1)) };
  }
  function maskText(text) {
    let out = String(text ?? '');
    if (prefs.emails || !P) return out;
    for (const c of P.creds) if (c.email) out = out.split(c.email).join(maskEmail(c.email));
    return out;
  }
  const displayName = (c) => (c.email ? maskEmail(c.email) : maskText(c.name || c.id || 'credential'));
  const shortName = (c) => (c.email ? maskEmail(c.email).split('@')[0] : maskText(c.name || '')) + (P.dups.has(c) ? ' ' + P.codes.get(c) : '');
  function hexId(c) {
    const m = String(c.name || '').match(/^claude-([0-9a-f]{6,})-/i);
    return m ? m[1] : '';
  }
  // Usage error -> [': HTTP 401', 'OAuth token has expired']
  function errParts(text) {
    const code = (text.match(/status (\d{3})/) || [])[1];
    const msg = (text.match(/"message"\s*:\s*"([^"]+)"/) || [])[1];
    return [code ? ':' + NB + 'HTTP' + NB + code : ' request failed', String(msg || text).replace(/[.\s]+$/, '')];
  }

  // ---------- Render ----------
  function captureFocus() {
    const a = document.activeElement;
    if (!a || a === document.body || !$('app').contains(a)) return null;
    if (a.dataset.refresh) return { sel: `[data-refresh="${CSS.escape(a.dataset.refresh)}"]` };
    if (a.dataset.reset) return { sel: `[data-reset="${CSS.escape(a.dataset.reset)}"]`, alt: `[data-refresh="${CSS.escape(a.dataset.reset)}"]` };
    if (a.dataset.window) return { sel: `[data-window="${CSS.escape(a.dataset.window)}"]` };
    if (a.dataset.pick) return { sel: `[data-pick="${a.dataset.pick}"]`, alt: '#window-select' };
    if (a.dataset.fetch) return { sel: '[data-fetch]', alt: '#refresh-all-btn' };
    if (a.dataset.goto) return { sel: `[data-goto="${CSS.escape(a.dataset.goto)}"]` };
    // A control gone after it worked hands focus on: a tile action to its first row, Retry to Refresh all.
    if (a.dataset.act) return { sel: `[data-act="${a.dataset.act}"][data-ids="${CSS.escape(a.dataset.ids)}"]`, alt: `[data-refresh="${CSS.escape(a.dataset.ids.split(' ')[0])}"]` };
    if (a.id) return { sel: '#' + CSS.escape(a.id), alt: '#refresh-all-btn' };
    if (a.matches('summary')) return { sel: `#${CSS.escape(a.closest('tr').id)} summary` };
    return null;
  }
  function restoreFocus(f) {
    if (!f) return;
    const a = document.activeElement;
    if (a && a !== document.body && a.isConnected) return;
    const el = document.querySelector(f.sel) || (f.alt && document.querySelector(f.alt));
    if (el) el.focus({ preventScroll: true });
  }

  function render() {
    const focus = captureFocus();
    applyChrome();
    renderStatus();
    if (!data) {
      renderShell();
      restoreFocus(focus);
      return;
    }
    renderNotice();
    renderTiles();
    renderChart();
    renderDataTable();
    renderList();
    restoreFocus(focus);
  }

  function applyChrome() {
    const light = prefs.theme === 'light';
    document.documentElement.classList.toggle('light', light);
    const tb = $('theme-btn');
    const tl = light ? 'Switch to dark theme' : 'Switch to light theme';
    tb.setAttribute('aria-label', tl); tb.title = tl;
    tb.innerHTML = icon(light ? 'moon' : 'sun');
    const eb = $('emails-btn');
    eb.setAttribute('aria-pressed', String(prefs.emails));
    eb.innerHTML = icon(prefs.emails ? 'eye-off' : 'eye') + '<span class="lbl">' + (prefs.emails ? 'Hide emails' : 'Show emails') + '</span>';
    eb.title = prefs.emails ? 'Hide full email addresses' : 'Show full email addresses';
    document.querySelectorAll('[data-tab]').forEach((el) => {
      const on = el.dataset.tab === prefs.tab;
      el.classList.toggle('on', on);
      el.setAttribute('aria-pressed', String(on));
    });
    const w = currentWindow();
    const ws = $('window-select');
    for (const o of ws.options) {
      const has = !P || P.anyWin.includes(o.value);
      o.textContent = WINDOWS[o.value].label + (has ? '' : ' (no data)');
    }
    ws.value = w;
    $('horizon-select').value = String(horizonFor(w));
    $('lookback-select').value = String(prefs.lookback);
    $('order-select').value = prefs.order;
    $('sort-select').value = prefs.sort;
    $('settings-help').textContent = prefs.order === 'even'
      ? 'Spread evenly drains every credential at the same pace. The drain rate is the average use over the chosen period.'
      : 'Soonest reset first uses up the credential that resets next, so less quota expires unused. The drain rate is the average use over the chosen period.';
    renderBusy();
  }

  function renderBusy() {
    const ra = $('refresh-all-btn');
    ra.classList.toggle('busy', busyAll);
    ra.setAttribute('aria-disabled', String(busyAll));
    ra.querySelector('span').textContent = busyAll ? 'Refreshing…' : 'Refresh all';
    document.querySelectorAll('[data-refresh]').forEach((b) => {
      const busy = busyAll || busyRows.has(b.dataset.refresh);
      b.classList.toggle('busy', busy);
      b.setAttribute('aria-disabled', String(busy));
    });
    document.querySelectorAll('[data-reset]').forEach((b) => {
      const busy = busyRows.has(b.dataset.reset);
      b.setAttribute('aria-disabled', String(busy));
      b.textContent = busy ? 'Clearing…' : 'Clear cooldown';
    });
    document.querySelectorAll('[data-act="reset"], [data-act="retry"]').forEach((b) => {
      const busy = b.dataset.ids.split(' ').some((id) => busyRows.has(id)) || (busyAll && b.dataset.act === 'retry');
      b.classList.toggle('busy', busy);
      b.setAttribute('aria-disabled', String(busy));
    });
    const list = $('cred-list');
    if (busyAll) list.setAttribute('aria-busy', 'true'); else list.removeAttribute('aria-busy');
  }

  let statusHtml = null;
  // Writes #status only when it changes, so the live region does not repeat itself on every reload.
  function renderStatus() {
    const el = $('status');
    const set = (cls, html) => {
      if (cls + html === statusHtml) return;
      statusHtml = cls + html;
      el.className = 'status' + cls;
      el.innerHTML = html;
    };
    if (flash && flash.until < Date.now()) flash = null;
    if (loading && !data) return set('', icon('refresh', 'spin on') + 'Loading quota history…');
    if (busyAll) return set('', icon('refresh', 'spin on') + 'Refreshing every credential…');
    if (loadError) {
      return set(data ? ' warn' : ' bad', data
        ? icon('alert') + '<span>Update failed at ' + esc(fmtClock(loadError.at)) + ': ' + esc(loadError.message) + '. Showing data from ' + esc(fmtClock(lastOkAt)) + ', retrying every minute.</span>' +
          '<button class="btn" type="button" id="retry-btn">Retry now</button>'
        : icon('alert') + '<span>Not loaded. Retrying every minute.</span>');
    }
    if (!data) return set('', '');
    if (flash) return set(flash.kind === 'bad' ? ' bad' : '', icon(flash.kind === 'bad' ? 'alert' : 'check') + '<span>' + esc(flash.text) + '</span>');
    const parts = ['Updated ' + fmtClock(lastOkAt)];
    let cls = '';
    if (P.newest) {
      const age = Date.now() - lastOkAt + (P.now - P.newest);
      if (age > 3 * P.interval) cls += ' warn';
      parts.push('newest sample ' + (age < MIN ? 'just now' : fmtDur(age) + ' ago'));
    } else {
      cls += ' idle';
      if (P.creds.length) parts.push('no samples yet');
    }
    let meta = '';
    if (P.creds.length) {
      let need = 0, waiting = 0, off = 0;
      for (const c of P.creds) {
        const s = credState(c);
        if (s.disabled) off++;
        else if (s.cooldown || s.error || s.stale) need++;
        else if (s.never) waiting++;
      }
      const bits = [esc(plural(P.creds.length, 'credential'))];
      if (need) bits.push('<span class="att">' + need + (need === 1 ? ' needs' : ' need') + ' attention</span>');
      if (waiting) bits.push(waiting + ' not sampled yet');
      if (off) bits.push(off + ' disabled');
      if (!need && !waiting && !off) bits.push('all working');
      meta = '<span class="meta" aria-live="off">' + bits.join(' · ') + '</span>';
    }
    // The routine line is not announced; flashes and errors are.
    set(cls, meta + '<span class="fresh" aria-live="off"><span class="dot" aria-hidden="true"></span><span>' + esc(parts.join(' · ')) + '</span></span>');
  }

  function renderShell() {
    // Skeleton while the first load runs, or an error card if it failed.
    const notice = $('notice');
    if (loadError) {
      notice.hidden = false;
      notice.className = 'notice bad';
      notice.setAttribute('role', 'alert');
      const m = loadError.message;
      notice.innerHTML = icon('plug', 'lg') + '<div><h2>Couldn\'t load quota history</h2><p>' + esc(m.charAt(0).toUpperCase() + m.slice(1)) +
        '. The page tries again every minute.</p><div class="actions"><button class="btn" type="button" id="retry-btn2">' + icon('refresh') + 'Try again</button>' +
        '<button class="btn ghost" type="button" id="change-key-btn">Change key</button></div></div>';
    } else { notice.hidden = true; notice.innerHTML = ''; }
    const sk = '<div class="tile" aria-hidden="true"><div class="skel" style="height:12px;width:40%"></div><div class="skel" style="height:28px;width:55%"></div>' +
      '<div class="skel" style="height:6px"></div><div class="skel" style="height:12px;width:70%"></div></div>';
    $('tiles').hidden = false;
    $('tiles').innerHTML = loadError ? '' : sk + sk + sk;
    $('legend').innerHTML = '';
    $('chart-svg').innerHTML = '';
    $('chart-svg').setAttribute('aria-label', loadError ? 'No data loaded' : 'Loading');
    const msg = $('chart-msg');
    msg.hidden = false;
    msg.innerHTML = loadError ? '<p class="msg-title">No data to chart</p><p class="msg-body">The quota history did not load.</p>' : '<div class="skel" style="position:absolute;inset:0;opacity:.5"></div><p class="msg-body" style="position:relative">Loading quota history…</p>';
    $('chart-caption').textContent = '';
    $('data-table').innerHTML = '';
    $('cred-head').innerHTML = '';
    $('cred-head').closest('section').hidden = false;
    $('cred-meta').textContent = '';
    $('cred-list').innerHTML = loadError ? '' : [0, 1, 2].map(() => '<tr class="skel-row" aria-hidden="true"><td><div class="skel" style="height:36px"></div></td></tr>').join('');
  }

  function renderNotice() {
    const notice = $('notice');
    notice.removeAttribute('role');
    const w = currentWindow();
    if (prefs.window && prefs.window !== w && !windowChosen) {
      notice.hidden = false;
      notice.className = 'notice slim info';
      notice.innerHTML = icon('info') + '<span>No credential reports a ' + esc(WINDOWS[prefs.window].label) + ' limit, so this view shows ' + esc(WINDOWS[w].label) + '.</span>';
      return;
    }
    notice.hidden = true;
    notice.innerHTML = '';
  }

  // ---------- Stat tiles ----------
  function renderTiles() {
    const el = $('tiles');
    const w = currentWindow();
    const wins = P.statusWin;
    // Most urgent first: windows that run out (soonest first), then those that could run out at the
    // fastest measured rate, then the rest by share left.
    const rank = (m) => {
      if (m.capacity && m.remaining < 0.5) return [0, m.now];
      if (m.forecastable && m.runout !== null) return [0, m.runout];
      const u = m.fast || m.unsure;
      if (u && u.runout !== null) return [1, u.runout];
      return [2, m.share === null ? Infinity : m.share];
    };
    const ms = wins.map((x) => model(x)).sort((a, b) => { const ra = rank(a), rb = rank(b); return ra[0] - rb[0] || ra[1] - rb[1]; });
    if (!P.creds.length) { el.innerHTML = ''; el.hidden = true; return; }
    el.hidden = false;
    // With no usage data at all, the chart's message is the only one; the header counts the credentials.
    const onlyWaiting = !wins.length && P.creds.every((c) => { const s = credState(c); return s.never && !s.disabled && !s.cooldown && !s.error; });
    if (onlyWaiting) { el.innerHTML = ''; el.hidden = true; return; }
    let html = ms.map((m, i) => windowTile(m, m.w === w, i === 0)).join('');
    html += credsTile();
    el.classList.toggle('n4', ms.length >= 3);
    el.innerHTML = html;
  }

  // The tile's verdict: an icon, a headline and one detail line. Returns HTML; time phrases stay on one line.
  function tileVerdict(m) {
    const pace = (h) => 'the ' + nw(PACE[h] + ' pace');
    if (m.capacity && m.remaining < 0.5) return { kind: 'bad', icon: 'stop', head: 'Empty now' };
    if (!m.forecastable) {
      return { kind: 'neutral', icon: 'info', head: 'No forecast yet', sub: m.count ? esc(fmtDur(m.span)) + ' of samples so far, needs 1' + NB + 'hour' : 'No samples yet' };
    }
    if (m.runout !== null) {
      const head = 'Runs out ' + nw(fmtWhen(m.runout));
      return { kind: 'bad', icon: 'stop', head,
        sub: 'In ' + nw(fmtDur(m.runout - m.now)) + ' at ' + pace(prefs.lookback) + '.' + (m.fast ? ' Sooner at ' + pace(m.fast.lookback) + ': ' + nw(fmtWhen(m.fast.runout, true)) + '.' : '') };
    }
    if (m.fast) {
      return { kind: 'warn', icon: 'alert', head: 'Lasts at ' + pace(prefs.lookback), sub: 'Could run out ' + nw(fmtWhen(m.fast.runout)) + ' at ' + pace(m.fast.lookback) };
    }
    if (m.unsure && m.unsure.runout === null) return { kind: 'neutral', icon: 'info', head: 'No forecast yet', sub: 'Not measured since the reset' };
    if (m.unsure) {
      const n = m.unsure.members.length, head = 'Could run out ' + nw(fmtWhen(m.unsure.runout));
      return { kind: 'warn', icon: 'alert', head,
        sub: 'Without ' + (n === 1 ? esc(shortName(m.unsure.members[0].c)) + ', whose reset is assumed' : n + ' credentials whose resets are assumed') };
    }
    // Another window that runs out inside this one's horizon is the real limit, so this one is not green.
    const end = m.now + horizonFor(m.w) * DAY;
    let first = null;
    for (const x of P.statusWin) {
      const o = model(x), t = o.capacity && o.remaining < 0.5 ? o.now : o.forecastable ? o.runout : null;
      if (x !== m.w && t !== null && t < end && !(first && first.t <= t)) first = { t, label: WINDOWS[x].label };
    }
    if (first) {
      return { kind: 'neutral', icon: 'info', head: 'Not the limit',
        sub: esc(first.label) + (first.t <= m.now ? ' is empty now' : ' runs out first, ' + nw(fmtWhen(first.t))) };
    }
    const horizon = nw(horizonText(horizonFor(m.w)));
    return { kind: 'good', icon: 'check', head: 'Lasts the next ' + horizon, short: 'Lasts ' + horizon,
      sub: m.rate > 0 ? 'At ' + pace(prefs.lookback) + '.' : 'No use in the last ' + esc(LOOKBACK_LABEL[prefs.lookback]) };
  }

  function windowTile(m, selected, lead) {
    const label = WINDOWS[m.w].label;
    const share = m.share ?? 0;
    const units = m.remaining / 100;
    const v = tileVerdict(m);
    const verdict = `<div class="verdict ${v.kind}">${icon(v.icon)}<div><p class="v-main">${v.head}</p>${v.sub ? `<p class="v-sub">${v.sub}</p>` : ''}</div></div>`;
    let reset = '';
    if (m.nextReset) {
      const r = m.nextReset;
      reset = `<div class="tile-sub">Next reset <b class="nw">in ${esc(fmtDur(r.t - m.now))}</b> <span class="nw">(${esc(fmtWhen(r.t))})</span> <span class="nw">adds about ${pct(r.adds)}</span></div>`;
    }
    // Cooling-down credentials count in the share but cannot take requests now. Assumed resets are named instead.
    const assumedN = m.pool.filter((p) => p.assumed).length;
    const held = m.pool.reduce((sum, p) => sum + (credState(p.c).cooldown ? p.rem : 0), 0);
    const usable = fmtAccounts((m.remaining - held) / 100);
    let extra = assumedN ? `, <span class="nw">includes ${plural(assumedN, 'assumed reset')}</span>` : m.capacity && held / m.capacity >= 0.25 ? `, <span class="nw">${usable === '0' ? 'not' : 'about ' + usable} usable now</span>` : '';
    if (m.notReporting) extra += `, <span class="nw">${m.notReporting} not reporting</span>`;
    // Same thresholds as the row meters, so a 5% pool reads as low at a glance.
    const r = Math.round(share);
    const level = !m.capacity ? '' : r === 0 ? 'empty' : share <= 10 ? 'bad' : share <= 25 ? 'warn' : '';
