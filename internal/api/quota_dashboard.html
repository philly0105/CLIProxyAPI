    // Accessible name stays "Show <window> in chart"; aria-pressed says whether it is the charted window.
    const btn = `<button type="button" class="tile-btn" data-window="${m.w}" aria-pressed="${selected}">${icon('chart')}<span class="bt">` +
      (selected ? `<span class="sr-only">Show ${esc(label)} </span>In chart` : `Show <span class="sr-only">${esc(label)} </span>in chart`) + '</span></button>';
    // One-line summary that replaces the body on phones for every tile but the most urgent one.
    const brief = `<p class="tile-brief"><b>${pct(share)}</b> left · <span class="vk ${v.kind}">${icon(v.icon)}${v.short || v.head}</span></p>`;
    return `<div class="tile pick${selected ? ' sel' : ''}${lead ? ' lead' : ''}">
      <div class="tile-head"><h3>${esc(label)}</h3>${brief}${btn}</div>
      <div class="tile-value"><span class="big">${pct(share)}</span><span class="unit">of pool left</span></div>
      <div class="poolbar${level ? ' ' + level : ''}" role="meter" aria-label="${esc(label)} pool left" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${r}"><i style="width:${clampPct(share).toFixed(1)}%"></i></div>
      <div><div class="tile-sub">About <b class="nw">${fmtAccounts(units)} of ${plural(m.poolSize, 'account')}</b>${extra}</div>${reset}</div>
      ${verdict}
    </div>`;
  }

  // Credentials tile: one line per problem, worst first. Over four problems, lines group by state.
  function credsTile() {
    const creds = P.creds;
    const probs = [];
    for (const c of creds) {
      const s = credState(c);
      if (s.disabled) { probs.push({ kind: 'disabled', c, s }); continue; }
      if (s.cooldown) probs.push({ kind: 'cooldown', c, s });
      if (s.error) probs.push({ kind: 'error', c, s });
      else if (s.stale) probs.push({ kind: 'stale', c, s });
      if (s.never) probs.push({ kind: 'never', c, s });
    }
    const KINDS = {
      cooldown: { tone: 'bad', icon: 'clock', group: 'Cooling down' },
      error: { tone: 'warn', icon: 'alert', group: 'Fetch failing' },
      stale: { tone: 'warn', icon: 'clock', group: 'No new samples' },
      never: { tone: '', icon: 'dashed', group: 'Not sampled yet' },
      disabled: { tone: '', icon: 'ban', group: 'Disabled' },
    };
    const order = Object.keys(KINDS);
    probs.sort((a, b) => order.indexOf(a.kind) - order.indexOf(b.kind));
    const go = (c) => `<button type="button" class="goto" data-goto="${esc(c.auth_index)}" title="Go to this credential's row">${esc(shortName(c))}</button>`;
    const act = (kind, ids, label) => {
      if (kind === 'disabled') return '';
      const a = kind === 'cooldown' ? 'reset' : 'retry';
      const title = a === 'reset' ? 'The proxy routes requests here again. The Anthropic limit does not change.' : 'Fetch usage now';
      return ` <button type="button" class="p-act" data-act="${a}" data-ids="${esc(ids.join(' '))}" title="${title}">${label}</button>`;
    };
    const httpCode = (s) => { const m = /status (\d{3})/.exec(s.error.text); return m ? ' (HTTP ' + m[1] + ')' : ''; };
    const what = (p) => {
      const s = p.s;
      if (p.kind === 'cooldown') return 'cooling down, back' + NB + 'in' + NB + nw(fmtDur(s.cooldown.left));
      if (p.kind === 'error') return 'fetch failing' + esc(httpCode(s)) + (P.statusWin.some((x) => isAssumed(s, usageOf(p.c, x), P.now)) ? ', reset assumed' : s.stale ? ' for ' + nw(fmtDur(s.stale)) : '');
      if (p.kind === 'stale') return 'no new sample for ' + nw(fmtDur(s.stale));
      if (p.kind === 'never') return 'not sampled yet';
      return 'disabled' + (s.fetched ? ', last data ' + nw(fmtDateTime(s.fetched)) : '');
    };
    const line = (kind, inner) => `<li class="prob ${KINDS[kind].tone}">${icon(KINDS[kind].icon)}<p>${inner}</p></li>`;
    const verb = { cooldown: ['Clear cooldown', 'Clear all '], never: ['Fetch now', 'Fetch all '] };
    const single = (p) => line(p.kind, `${go(p.c)} ${what(p)}${act(p.kind, [p.c.auth_index], (verb[p.kind] || ['Retry now'])[0])}`);
    let lines = [];
    if (probs.length > 4) {
      for (const kind of order) {
        const ps = probs.filter((p) => p.kind === kind);
        if (!ps.length) continue;
        if (ps.length === 1) { lines.push(single(ps[0])); continue; }
        let tail = '';
        if (kind === 'cooldown') tail = ', first back' + NB + 'in' + NB + nw(fmtDur(Math.min(...ps.map((p) => p.s.cooldown.left))));
        const ids = ps.map((p) => p.c.auth_index);
        const label = (verb[kind] || [0, 'Retry all '])[1] + ids.length;
        lines.push(line(kind, `<b>${KINDS[kind].group} (${ps.length})</b>: ${ps.map((p) => go(p.c)).join(', ')}${tail}${act(kind, ids, label)}`));
      }
    } else {
      lines = probs.map(single);
    }
    const inPool = creds.length - probs.filter((p) => p.kind === 'disabled').length;
    // A failing usage fetch still serves requests, so only cooldowns cut the working count.
    const working = inPool - probs.filter((p) => p.kind === 'cooldown').length;
    let body;
    if (!creds.length) body = '<div class="tile-sub">Add a Claude auth file to the proxy and it shows up here.</div>';
    else if (!probs.length) body = `<p class="all-ok">${icon('check')}${creds.length === 1 ? 'Working, nothing needs attention' : 'All ' + creds.length + ' working, nothing needs attention'}</p>`;
    else body = `<ul class="probs" aria-label="Problems">${lines.join('')}</ul>`;
    return `<div class="tile creds-tile${probs.length ? '' : ' ok'}">
      <div class="tile-head"><h3>Credentials</h3></div>
      <div class="tile-value"><span class="big${creds.length ? '' : ' muted'}">${creds.length}</span><span class="unit">${!creds.length ? 'configured' : esc((inPool === creds.length ? 'in pool' : inPool + ' in pool') + (working < inPool ? ' · ' + working + ' working' : ''))}</span></div>
      ${body}
    </div>`;
  }
  const nw = (t) => `<span class="nw">${esc(t)}</span>`;


  // ---------- Chart ----------
  function chartFrame() {
    const svg = $('chart-svg');
    const box = svg.getBoundingClientRect();
    const W = Math.max(200, Math.round(box.width || 600));
    const H = Math.max(160, Math.round(box.height || 260));
    const narrow = W < 520;
    return { svg, W, H, narrow, m: { l: narrow ? 42 : 44, r: narrow ? 6 : 12, t: 28, b: 26 } };
  }

  function timeTicks(x0, x1, width) {
    const span = x1 - x0;
    const max = Math.max(4, Math.floor(width / 90));
    const ticks = [];
    let fmt;
    // Clock labels ("10:10 AM") are wider than day labels, and the edge ones are anchored inward, so space them wider.
    const minStep = span <= 3 * HOUR ? [10, 15, 20, 30].find((n) => span / (n * MIN) <= Math.max(2, Math.floor(width / 120))) : null;
    const hourStep = minStep ? null : [1, 2, 3, 6, 12].find((h) => span / (h * HOUR) <= max);
    if (minStep) {
      const d = new Date(x0); d.setSeconds(0, 0);
      d.setMinutes(Math.ceil(d.getMinutes() / minStep) * minStep);
      for (let guard = 0; d.getTime() <= x1 && guard < 400; guard++) {
        ticks.push(d.getTime());
        d.setMinutes(d.getMinutes() + minStep);
      }
      fmt = (t) => new Date(t).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
    } else if (hourStep) {
      const d = new Date(x0); d.setMinutes(0, 0, 0);
      d.setHours(Math.ceil(d.getHours() / hourStep) * hourStep);
      for (let guard = 0; d.getTime() <= x1 && guard < 400; guard++) {
        if (d.getTime() >= x0) ticks.push(d.getTime());
        d.setHours(d.getHours() + hourStep);
      }
      fmt = (t) => { const x = new Date(t); return x.getHours() === 0 ? x.toLocaleDateString(undefined, { weekday: 'short' }) : x.toLocaleTimeString(undefined, { hour: 'numeric' }); };
    } else {
      const dayStep = [1, 2, 3, 4, 7].find((n) => span / (n * DAY) <= max) || 14;
      const d = new Date(x0); d.setHours(0, 0, 0, 0);
      if (d.getTime() < x0) d.setDate(d.getDate() + 1);
      for (let guard = 0; d.getTime() <= x1 && guard < 400; guard++) {
        ticks.push(d.getTime());
        d.setDate(d.getDate() + dayStep);
      }
      fmt = (t) => new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    }
    return { ticks, fmt };
  }

  // X tick labels: calendar-stepped, duplicate labels dropped, edge labels anchored inward.
  function xAxis(x0, x1, sx, W, H, mg) {
    const { ticks, fmt } = timeTicks(x0, x1, W - mg.l - mg.r);
    let out = '', lastLabel = '';
    for (const t of ticks) {
      const lbl = fmt(t);
      if (lbl === lastLabel) continue;
      lastLabel = lbl;
      const x = sx(t);
      if (x < mg.l - 1 || x > W - mg.r + 1) continue;
      const anchor = x < mg.l + 22 ? 'start' : x > W - mg.r - 22 ? 'end' : 'middle';
      out += `<line x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${H - mg.b}" y2="${H - mg.b + 4}" stroke="var(--line-2)" stroke-width="1"/>`;
      out += `<text x="${x.toFixed(1)}" y="${H - mg.b + 20}" text-anchor="${anchor}" class="axis">${esc(lbl)}</text>`;
    }
    return out;
  }

  // Sizes a pill <rect> to the text it holds after the svg is in the DOM.
  function fitPills(svg) {
    const num = (el, a) => Number(el.getAttribute(a));
    const fit = (r) => {
      const t = svg.querySelector('#' + r.dataset.pill);
      if (!t) return;
      let w = 0;
      try { w = t.getComputedTextLength(); } catch {}
      if (!w) return;
      const pad = 8, min = Number(r.dataset.min || 0), max = Number(r.dataset.max || 1e9);
      const cx = Number(r.dataset.cx || t.getAttribute('x'));
      const width = w + pad * 2;
      let left = Math.max(min, cx - width / 2);
      left = Math.max(Number(r.dataset.floor || 0), Math.min(max - width, left));
      r.setAttribute('x', left.toFixed(1));
      r.setAttribute('width', width.toFixed(1));
      t.setAttribute('x', (left + width / 2).toFixed(1));
    };
    svg.querySelectorAll('[data-pill]').forEach(fit);
    // The Now pill stays on its line. An Empty chip that would cover it shortens, then moves to a second row.
    const now = svg.querySelector('.now-pill'), outp = svg.querySelector('.out-pill'), near = svg.querySelector('#pool-near');
    if (!now) return;
    const left = num(now, 'x'), right = left + num(now, 'width');
    if (outp) {
      const t = svg.querySelector('#out-txt');
      if (num(outp, 'x') < right + 4 && t.dataset.short) { t.textContent = t.dataset.short; fit(outp); }
      if (num(outp, 'x') < right + 4) { outp.setAttribute('y', '26'); t.setAttribute('y', '40'); }
    }
    // A pool-size change by Now keeps its label on its tick, else right of the Now pill if there is room, else only the tick.
    const own = near ? num(near, 'x') : 0, onTick = near && own + near.getComputedTextLength() / 2 + 4 <= left;
    if (near && !onTick) {
      const lim = Math.min(Number(now.dataset.max), outp && num(outp, 'y') < 20 ? num(outp, 'x') - 4 : 1e9);
      if (right + 4 + near.getComputedTextLength() <= lim) { near.setAttribute('x', (right + 4).toFixed(1)); near.setAttribute('text-anchor', 'start'); }
      else near.remove();
    }
    svg.querySelectorAll('.pt').forEach((t) => { if (t !== near && (num(t, 'x') > left - 10 || (onTick && own - num(t, 'x') < 28))) t.remove(); });
  }

  function emptyReason(m, w) {
    const label = WINDOWS[w].label;
    if (!P.creds.length) return { title: 'No Claude credentials yet', body: 'Add a Claude auth file to the proxy. Its quota shows up here after the next sample, within ' + Math.round(P.interval / MIN) + ' minutes.', icon: 'users' };
    if (!P.samples.length && !P.statusWin.length) return { title: 'No samples yet', body: `The proxy checks usage every ${Math.round(P.interval / MIN)} minutes. Fetch now to see it sooner.`, icon: 'chart', fetch: true };
    if (!m.poolSize && !m.history.length) {
      const others = P.anyWin.filter((x) => x !== w);
      return {
        title: `No credential reports a ${label} limit`,
        body: others.length ? `These credentials report ${others.map((x) => WINDOWS[x].label).join(' and ')} limits.` : 'Nothing has been sampled for this window.',
        icon: 'chart', picks: others,
      };
    }
    return null;
  }

  function showChartMsg(r) {
    const msg = $('chart-msg');
    msg.hidden = false;
    const picks = (r.picks || []).map((x) => `<button type="button" class="btn sm" data-pick="${x}">Show ${esc(WINDOWS[x].label)}</button>`).join('');
    const fetch = r.fetch ? '<button type="button" class="btn sm" data-fetch="1">' + icon('refresh', 'sm') + 'Fetch now</button>' : '';
    msg.innerHTML = icon(r.icon || 'chart', 'lg') + `<p class="msg-title">${esc(r.title)}</p><p class="msg-body">${esc(r.body)}</p>` +
      (picks || fetch ? `<div class="actions">${picks}${fetch}</div>` : '');
  }

  function renderChart() {
    // A keyboard reader keeps their place across the 60 s reload: the nearest point at the same time.
    const keep = chartIndex >= 0 && document.activeElement === $('chart-svg') ? chartPoints.pts[chartIndex].t : null;
    hideTip();
    chartPoints = null;
    chartIndex = -1;
    const w = currentWindow();
    const m = model(w);
    const empty = emptyReason(m, w);
    // Measure the frame at its full height; an empty-state message gets a shorter box.
    $('chart').classList.remove('is-empty');
    const f = chartFrame();
    const { svg, W, H } = f;
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    const msg = $('chart-msg');
    if (empty) {
      svg.innerHTML = '';
      svg.setAttribute('aria-label', empty.title);
      showChartMsg(empty);
      $('chart').classList.add('is-empty');
      $('legend').innerHTML = '';
      $('chart-caption').textContent = '';
      return;
    }
    msg.hidden = true;
    msg.innerHTML = '';
    renderRates(m, w);
    if (prefs.tab === 'drain') renderDrain(f, m, w);
    else renderRemaining(f, m, w);
    if (keep !== null) showPoint(nearestIndex(keep));
  }

  // Forecast settings: the four measured rates as pool share, the one in use in bold, then per account.
  function renderRates(m, w) {
    const el = $('settings-rates');
    if (!m.capacity) { el.textContent = ''; return; }
    if (!m.forecastable) { el.textContent = `Measured ${WINDOWS[w].label} rates appear after 1 hour of data.`; return; }
    const short = { 6: '6 h', 24: '24 h', 72: '3 d', 168: '7 d' };
    const list = (f, mark) => LOOKBACKS.map((h) => { const txt = short[h] + ' ' + fmtPct1(f(m.rates[h])); return mark && h === prefs.lookback ? `<strong>${esc(txt)} (in use)</strong>` : esc(txt); }).join(' · ');
    el.innerHTML = `Measured ${esc(WINDOWS[w].label)} rates, share of the pool per hour: ${list((r) => poolRate(m, r), true)}.` +
      `<br><span class="sec">Per account, share of one account's limit per hour: ${list((r) => r)}.` +
      (m.leftCount ? ` The rate counts use by ${plural(m.leftCount, 'credential')} no longer in the pool.` : '') + '</span>';
  }

  function renderRemaining(f, m, w) {
    const { svg, W, H } = f;
    const mg = { ...f.m };
    const label = WINDOWS[w].label;
    const horizon = horizonFor(w) * DAY;
    const histStart = m.history.length ? m.history[0].t : m.now;
    const showForecast = m.forecastable && m.capacity > 0;
    let x0, x1;
    if (showForecast) { x0 = Math.min(Math.max(histStart, m.now - horizon), m.now - HOUR); x1 = m.now + horizon; }
    else if (m.capacity) {
      // Under an hour of samples: zoom to them, with the same width on the right for the "forecast after" note.
      const half = Math.max(20 * MIN, (m.now - histStart) * 1.15);
      x0 = m.now - half; x1 = m.now + half;
    } else { x0 = Math.min(histStart, m.now - HOUR); x1 = m.now + HOUR; }
    const pw = W - mg.l - mg.r;
    const sx = (t) => mg.l + (t - x0) / (x1 - x0) * pw;
    const shareOf = (p) => (p.cap ? p.v / p.cap * 100 : 0);
    const f1 = (n) => n.toFixed(1);

    // History: carry the point just before x0 so the step line starts at the left edge.
    let startIdx = m.history.findIndex((p) => p.t >= x0);
    if (startIdx === -1) startIdx = m.history.length;
    const hist = m.history.slice(Math.max(0, startIdx - 1)).map((p) => ({ ...p, t: Math.max(p.t, x0), s: shareOf(p) }));

    // Forecast at the chosen rate.
    const proj = showForecast ? m.projection.map((p) => ({ t: p.t, s: p.v / m.capacity * 100, v: p.v, rs: p.rs })) : [];

    // Empty stretches of the main forecast.
    const empties = [];
    let eStart = null;
    for (const p of proj) {
      if (p.v < 0.5) { if (eStart === null) eStart = p.t; }
      else if (eStart !== null) { empties.push([eStart, p.rs ?? p.t]); eStart = null; }
    }
    if (eStart !== null) empties.push([eStart, x1]);

    const ph = H - mg.t - mg.b;
    const sy = (v) => mg.t + ph - (clampPct(v) / 100) * ph;
    let out = '';

    // Grid and y labels (share of pool).
    const yTicks = f.narrow ? [0, 50, 100] : [0, 25, 50, 75, 100];
    for (const v of yTicks) {
      const y = sy(v);
      out += `<line x1="${mg.l}" x2="${W - mg.r}" y1="${y}" y2="${y}" stroke="var(--grid)" stroke-width="1"/>`;
      out += `<text x="${mg.l - 8}" y="${y + 4}" text-anchor="end" class="axis">${v}%</text>`;
    }

    const stepPath = (pts) => pts.map((p, i) => (i ? `L${f1(sx(p.t))},${f1(sy(pts[i - 1].s))} L` : 'M') + `${f1(sx(p.t))},${f1(sy(p.s))}`).join(' ');
    // An assumed reset was never recorded, so the step into Now is dotted.
    const assumedN = m.pool.filter((p) => p.assumed).length;
    const cut = assumedN && hist.length > 1 && hist[hist.length - 1].t === m.now ? hist.length - 1 : hist.length;
    if (hist.length) {
      const line = stepPath(hist.slice(0, cut));
      out += `<defs><linearGradient id="hist-fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--series)" stop-opacity=".16"/><stop offset="1" stop-color="var(--series)" stop-opacity="0"/></linearGradient></defs>`;
      out += `<path d="${line} L${f1(sx(hist[hist.length - 1].t))},${sy(0)} L${f1(sx(hist[0].t))},${sy(0)} Z" fill="url(#hist-fill)"/>`;
      out += `<path d="${line}" fill="none" stroke="var(--series)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
      if (cut < hist.length) out += `<path d="${stepPath(hist.slice(cut - 1))}" fill="none" stroke="var(--series)" stroke-width="2" stroke-dasharray="0 4" stroke-linecap="round"/>`;
    }
    const nx = sx(m.now);
    if (proj.length) {
      out += `<path d="${proj.map((p, i) => `${i ? 'L' : 'M'}${f1(sx(p.t))},${f1(sy(p.s))}`).join(' ')}" fill="none" stroke="var(--series)" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round"/>`;
    } else if (m.capacity) {
      const left = Math.max(0, HOUR - m.span);
      const lines = f.narrow ? ['Forecast after', '1 hour of data,', fmtDur(left) + ' to go'] : ['Forecast after 1 hour of data', fmtDur(left) + ' to go'];
      const cy = mg.t + ph / 2 - (lines.length - 1) * 8;
      out += `<text x="${f1((nx + W - mg.r) / 2)}" y="${f1(cy)}" text-anchor="middle" class="axis-lbl">` +
        lines.map((t, i) => `<tspan x="${f1((nx + W - mg.r) / 2)}" dy="${i ? 16 : 0}">${esc(t)}</tspan>`).join('') + '</text>';
    }

    // Empty stretches: a solid critical segment on the baseline.
    for (const [a, b] of empties) {
      const xa = sx(a), xb = Math.min(W - mg.r, sx(b));
      if (xa > W - mg.r) continue;
      out += `<line x1="${f1(xa)}" x2="${f1(Math.max(xa + 1, xb))}" y1="${sy(0)}" y2="${sy(0)}" stroke="var(--bad)" stroke-width="3" stroke-linecap="round"/>`;
    }

    // Pool size changes: a tick at each change's own time, "+1" or "-1" where labels fit; the tooltip has the detail.
    const signed = (d) => (d > 0 ? '+' + d : '\u2212' + -d);
    const changes = [];
    for (let i = 1; i < hist.length; i++) {
      const d = Math.round((hist[i].cap - hist[i - 1].cap) / 100);
      if (d) changes.push({ d, x: sx(hist[i].t) });
    }
    let lastLbl = -Infinity;
    changes.forEach((c, i) => {
      const near = i === changes.length - 1 && nx - c.x < 52;
      out += `<line x1="${f1(c.x)}" x2="${f1(c.x)}" y1="${mg.t - 6}" y2="${mg.t}" stroke="var(--ink-3)" stroke-width="1"/>`;
      // On phones a label by Now is dropped (the tick stays; the Now readout says how the pool changed).
      if (near ? !f.narrow : c.x - lastLbl >= 28) out += `<text${near ? ' id="pool-near"' : ''} x="${f1(lastLbl = c.x)}" y="${mg.t - 10}" text-anchor="middle" class="axis pt">${signed(c.d)}</text>`;
    });

    // Now marker with a pill label above the plot.
    out += `<line x1="${f1(nx)}" x2="${f1(nx)}" y1="22" y2="${H - mg.b}" stroke="var(--ink-3)" stroke-width="1" stroke-dasharray="3 3"/>`;
    out += `<rect class="now-pill" data-pill="now-txt" data-min="${mg.l}" data-max="${W - mg.r}" x="${f1(nx - 18)}" y="2" width="36" height="20" rx="4"/><text id="now-txt" class="now-txt" x="${f1(nx)}" y="16" text-anchor="middle">Now</text>`;

    // First empty stretch: dashed line from a chip above the plot down to the baseline.
    const firstEmpty = empties.length && sx(empties[0][0]) <= W - mg.r ? empties[0][0] : null;
    if (firstEmpty !== null) {
      const rx = sx(firstEmpty);
      if (rx - nx > 2) out += `<line x1="${f1(rx)}" x2="${f1(rx)}" y1="22" y2="${sy(0)}" stroke="var(--bad)" stroke-width="1" stroke-dasharray="3 3"/>`;
      const txt = firstEmpty <= m.now ? 'Empty now' : 'Empty ' + fmtWhen(firstEmpty, true);
      // Shorter text for a crowded strip: the day without the time ("Empty Sun").
      const days = Math.round((startOfDay(firstEmpty) - startOfDay(m.now)) / DAY);
      const short = days > 0 ? 'Empty ' + new Date(firstEmpty).toLocaleDateString(undefined, days < 7 ? { weekday: 'short' } : { month: 'short', day: 'numeric' }) : '';
      out += `<rect class="out-pill" data-pill="out-txt" data-cx="${f1(rx)}" data-min="${f1(nx + 26)}" data-floor="${mg.l}" data-max="${W - mg.r}" x="${f1(rx - 60)}" y="2" width="120" height="20" rx="4"/><text id="out-txt" class="out-txt" x="${f1(rx)}" y="16" text-anchor="middle"${short ? ` data-short="${esc(short)}"` : ''}>${esc(txt)}</text>`;
    }
    if (m.capacity) out += `<circle cx="${f1(nx)}" cy="${sy(m.share)}" r="4.5" fill="var(--series)" stroke="var(--surface)" stroke-width="2"/>`;

    out += xAxis(x0, x1, sx, W, H, mg);

    out += `<line id="cross" y1="${mg.t}" y2="${H - mg.b}" stroke="var(--ink-2)" stroke-width="1" visibility="hidden"/>`;
    out += `<circle id="cross-dot" r="4.5" fill="var(--series)" stroke="var(--surface)" stroke-width="2" visibility="hidden"/>`;
    svg.innerHTML = out;
    fitPills(svg);

    // Hover / keyboard points.
    const pts = hist.map((p, i) => ({ t: p.t, s: p.s, units: p.v / 100, cap: p.cap / 100, from: i && hist[i - 1].cap !== p.cap ? hist[i - 1].cap / 100 : null, kind: p.t === m.now ? 'Now' : 'Recorded', assumed: p.t === m.now ? assumedN : 0 }))
      .filter((p) => p.t >= x0);
    for (const p of proj.slice(1)) pts.push({ t: p.t, s: p.s, units: p.v / 100, cap: m.capacity / 100, kind: 'Forecast' });
    chartPoints = { kind: 'remaining', pts, sx, sy, W, H, mg, x0, x1 };

    // Legend, caption and accessible summary.
    const keys = ['<span class="key"><i class="k-line"></i>Recorded</span>'];
    if (proj.length) keys.push('<span class="key"><i class="k-dash"></i>Forecast</span>');
    if (firstEmpty !== null) keys.push('<span class="key"><i class="k-empty"></i>Empty</span>');
    $('legend').innerHTML = keys.join('');
    const order = prefs.order === 'even' ? 'spread evenly' : 'soonest reset first';
    $('chart-caption').textContent = 'Share of the pool left.' + (proj.length ? ` Forecast at ${fmtRate(m)} (last ${LOOKBACK_LABEL[prefs.lookback]}), ${order}.` : '');
    const verdict = !showForecast ? 'No forecast yet.' : m.runout !== null ? `Forecast runs out ${fmtWhen(m.runout)}.` : `Forecast lasts the next ${horizonText(horizonFor(w))}.`;
    svg.setAttribute('aria-label', `${label} pool: ${m.capacity ? pct(m.share) + ' left now' : 'no current data'}. ${verdict} Use the arrow keys to read values.`);
  }

  function drainBuckets(m) {
    const x1 = m.now;
    const histStart = m.history.length ? m.history[0].t : m.now;
    const x0 = Math.min(Math.max(histStart, m.now - horizonFor(m.w) * DAY), m.now - HOUR);
    const span = x1 - x0;
    const bh = span > 72 * HOUR ? 6 : span > 24 * HOUR ? 3 : 1;
    const keyOf = (t) => { const d = new Date(t); d.setMinutes(0, 0, 0); d.setHours(Math.floor(d.getHours() / bh) * bh); return d.getTime(); };
    const sums = new Map();
    for (const c of m.consumption) {
      if (c.t < x0) continue;
      const k = keyOf(c.t);
      sums.set(k, (sums.get(k) || 0) + c.amount);
    }
    const buckets = [];
    const d = new Date(keyOf(x0));
    for (let guard = 0; d.getTime() < x1 && guard < 2000; guard++) {
      const k = d.getTime();
      d.setHours(d.getHours() + bh);
      const end = d.getTime();
      const partial = end > x1;
      const hours = Math.max(0.25, (Math.min(end, x1) - k) / HOUR);
      // Share of the current pool, like the forecast rate.
      buckets.push({ k, end, partial, hours, v: (sums.get(k) || 0) / (m.poolSize || 1) / hours });
    }
    return { x0, x1, bh, buckets };
  }

  function renderDrain(f, m, w) {
    const { svg, W, H, m: mg } = f;
    const label = WINDOWS[w].label;
    const { x0, x1, bh, buckets } = drainBuckets(m);
    const pw = W - mg.l - mg.r, ph = H - mg.t - mg.b;
    const sx = (t) => mg.l + (t - x0) / (x1 - x0) * pw;
    const rate = poolRate(m);
    // The in-progress bar (paler) does not set the scale; when taller it is cut flat at the top and labelled.
    const maxV = Math.max(0.4, rate, ...buckets.filter((b) => !b.partial).map((b) => b.v));
    const tickStep = [0.1, 0.2, 0.5, 1, 2, 2.5, 5, 10, 20, 25].find((s) => s * 4 >= maxV) || Math.ceil(maxV / 400) * 100;
    const niceMax = tickStep * 4;
    const sy = (v) => mg.t + ph - (v / niceMax) * ph;
    let out = '';
    for (let i = 0; i <= 4; i++) {
      if (f.narrow && i % 2) continue;
      const v = tickStep * i, y = sy(v);
      out += `<line x1="${mg.l}" x2="${W - mg.r}" y1="${y}" y2="${y}" stroke="var(--grid)" stroke-width="1"/>`;
      out += `<text x="${mg.l - 8}" y="${y + 4}" text-anchor="end" class="axis">${+v.toFixed(1)}%</text>`;
    }
    const any = buckets.some((b) => b.v > 0);
    for (const b of buckets) {
      if (b.v <= 0) continue;
      const left = Math.max(mg.l, sx(b.k)), right = Math.min(W - mg.r, sx(b.end));
      const slot = right - left;
      if (slot <= 0) continue;
      const bw = Math.max(1, Math.min(24, slot - 2));
      const clip = b.v > niceMax, x = left + (slot - bw) / 2, y = Math.max(sy(b.v), mg.t), h = Math.max(1, sy(0) - y);
      const rr = clip ? 0 : Math.min(4, bw / 2, h);
      out += `<path d="M${x.toFixed(1)},${sy(0)} V${(y + rr).toFixed(1)} Q${x.toFixed(1)},${y.toFixed(1)} ${(x + rr).toFixed(1)},${y.toFixed(1)} H${(x + bw - rr).toFixed(1)} Q${(x + bw).toFixed(1)},${y.toFixed(1)} ${(x + bw).toFixed(1)},${(y + rr).toFixed(1)} V${sy(0)} Z" fill="var(--series-bar)"${b.partial ? ' fill-opacity=".45"' : ''}/>`;
      if (clip) out += `<text x="${(x - 4).toFixed(1)}" y="${mg.t + 12}" text-anchor="end" class="axis" stroke="var(--surface)" stroke-width="3" paint-order="stroke">${fmtPct1(b.v)}/h so far</text>`;
    }
    if (rate > 0) out += `<line x1="${mg.l}" x2="${W - mg.r}" y1="${sy(rate)}" y2="${sy(rate)}" stroke="var(--ink-2)" stroke-width="1" stroke-dasharray="4 4"/>`;
    out += xAxis(x0, x1, sx, W, H, mg);
    out += `<rect id="hover-bar" y="${mg.t}" height="${ph}" fill="var(--ink)" fill-opacity=".06" visibility="hidden"/>`;
    svg.innerHTML = out;
    chartPoints = { kind: 'drain', pts: buckets.map((b) => ({ ...b, t: (b.k + Math.min(b.end, x1)) / 2 })), sx, sy, W, H, mg, x0, x1 };

    const msg = $('chart-msg');
    if (!any) {
      msg.hidden = false;
      msg.innerHTML = `<p class="msg-body">No ${esc(label)} usage recorded in the last ${esc(horizonText(horizonFor(w)))}.</p>`;
    }
    $('legend').innerHTML = '<span class="key"><i class="k-bar"></i>Used per hour</span>' + (rate > 0 ? `<span class="key"><i class="k-ref"></i>Forecast rate ${esc(fmtPct1(rate))} per hour</span>` : '');
    $('chart-caption').textContent = `Share of the ${m.poolSize ? 'current ' + m.poolSize + '-account ' : ''}pool used per hour, in ${bh}-hour blocks.` + (buckets.some((b) => b.partial && b.v > 0) ? ' The paler bar is still in progress.' : '');
    svg.setAttribute('aria-label', `${label} use per hour over the last ${horizonText(horizonFor(w))}, as a share of the pool. Forecast rate ${fmtRate(m)}. Use the arrow keys to read values.`);
  }

  // Tooltip
  function hideTip() {
    clearTimeout(liveTimer);
    const tip = $('tooltip');
    tip.hidden = true;
    const cross = $('cross'), dot = $('cross-dot'), hb = $('hover-bar');
    if (cross) cross.setAttribute('visibility', 'hidden');
    if (dot) dot.setAttribute('visibility', 'hidden');
    if (hb) hb.setAttribute('visibility', 'hidden');
  }
  function nearestIndex(t) {
    const pts = chartPoints.pts;
    let best = -1, bd = Infinity;
    for (let i = 0; i < pts.length; i++) { const d = Math.abs(pts[i].t - t); if (d < bd) { bd = d; best = i; } }
    return best;
  }
  function showPoint(i) {
    if (!chartPoints || i < 0 || i >= chartPoints.pts.length) return;
    chartIndex = i;
    const { pts, sx, sy, W, H, mg, kind } = chartPoints;
    const p = pts[i];
    const tip = $('tooltip');
    const svg = $('chart-svg');
    const r = svg.getBoundingClientRect();
    const scale = r.width / W || 1;
    let cx;
    if (kind === 'remaining') {
      cx = sx(p.t);
      const cy = sy(p.s);
      const cross = $('cross'), dot = $('cross-dot');
      cross.setAttribute('x1', cx); cross.setAttribute('x2', cx); cross.setAttribute('visibility', 'visible');
      dot.setAttribute('cx', cx); dot.setAttribute('cy', cy); dot.setAttribute('visibility', 'visible');
      let h = `<div class="tt-time">${esc(fmtWhen(p.t))} · ${esc(p.kind.toLowerCase())}</div><div class="tt-val">${pct(p.s)} of pool left</div>` +
        `<div class="tt-sub">${fmtAccounts(p.units)} of ${plural(Math.round(p.cap), 'account')}</div>`;
      if (p.from !== null && p.from !== undefined) h += `<div class="tt-sub">Pool went from ${p.from} to ${plural(Math.round(p.cap), 'account')}</div>`;
      if (p.assumed) h += `<div class="tt-sub">Includes ${plural(p.assumed, 'assumed reset')}</div>`;
      tip.innerHTML = h;
    } else {
      const left = Math.max(mg.l, sx(p.k)), right = Math.min(W - mg.r, sx(p.end));
      cx = (left + right) / 2;
      const hb = $('hover-bar');
      hb.setAttribute('x', left); hb.setAttribute('width', Math.max(1, right - left)); hb.setAttribute('visibility', 'visible');
      const endLbl = new Date(p.end).toLocaleTimeString(undefined, { hour: 'numeric' });
      tip.innerHTML = `<div class="tt-time">${esc(fmtWhen(p.k))} to ${esc(endLbl)}${p.partial ? ' · so far' : ''}</div><div class="tt-val">${fmtPct1(p.v)} of the pool per hour</div>`;
    }
    tip.hidden = false;
    const tw = tip.offsetWidth;
    const px = cx * scale;
    let x = px > r.width / 2 ? px - tw - 12 : px + 12;
    x = Math.max(0, Math.min(x, r.width - tw));
    tip.style.left = x + 'px';
    tip.style.top = (mg.t * scale + 4) + 'px';
    clearTimeout(liveTimer);
    const said = [...tip.children].map((d) => d.textContent).join('. ');
    liveTimer = setTimeout(() => { if ($('chart-live').textContent !== said) $('chart-live').textContent = said; }, 150);
  }
  function pointerToIndex(e) {
    const svg = $('chart-svg');
    const r = svg.getBoundingClientRect();
    const { W, mg, x0, x1 } = chartPoints;
    const xv = (e.clientX - r.left) * W / r.width;
    const t = x0 + (xv - mg.l) / (W - mg.l - mg.r) * (x1 - x0);
    return nearestIndex(t);
  }

  // ---------- Data table ----------
  function renderDataTable() {
    const table = $('data-table');
    const w = currentWindow();
    const m = model(w);
    const label = WINDOWS[w].label;
    const caption = (t) => { $('data-cap').textContent = t; };
    if (!P.creds.length || (!m.history.length && !m.poolSize)) { caption('No data for this window.'); table.innerHTML = ''; return; }
    if (prefs.tab === 'drain') {
      const { buckets, bh } = drainBuckets(m);
      const rows = buckets.slice().reverse().map((b) => `<tr><td>${esc(fmtDateTime(b.k))}</td><td>${bh} h${b.partial ? ', in progress' : ''}</td><td>${fmtPct1(b.v)}</td></tr>`).join('');
      caption(`${label} use per hour as a share of the pool, newest first.`);
      table.innerHTML = `<thead><tr><th scope="col">Block start</th><th scope="col">Length</th><th scope="col">Used per hour</th></tr></thead><tbody>${rows}</tbody>`;
      return;
    }
    const range = horizonFor(w);
    const step = range <= 3 ? HOUR : range <= 7 ? 3 * HOUR : 6 * HOUR;
    const x0 = m.now - range * DAY;
    const hist = [];
    let lastKey = null;
    for (let i = m.history.length - 1; i >= 0; i--) {
      const p = m.history[i];
      if (p.t < x0) break;
      const k = Math.floor(p.t / step);
      if (k === lastKey) continue;
      lastKey = k;
      hist.push(p);
    }
    const row = (t, v, cap) => `<tr><td>${esc(fmtDateTime(t))}</td><td>${cap ? pct(v / cap * 100) : '-'}</td><td>${fmtAccounts(v / 100)}</td><td>${Math.round(cap / 100)}</td></tr>`;
    let fc = '';
    if (m.forecastable && m.capacity) {
      const every = Math.max(1, Math.round(step / Math.min(10 * MIN, m.period / 30)));
      fc = m.projection.filter((_, i) => i > 0 && i % every === 0).map((p) => row(p.t, p.v, m.capacity)).join('');
    }
    caption(`${label} pool, ${step / HOUR}-hour steps. Forecast first, then history, both starting from now.`);
    table.innerHTML = '<thead><tr><th scope="col">Time</th><th scope="col">Pool left</th><th scope="col">Accounts left</th><th scope="col">Accounts in pool</th></tr></thead>' +
      (fc ? `<tbody><tr><th scope="rowgroup" colspan="4">Forecast</th></tr>${fc}</tbody>` : '') +
      `<tbody><tr><th scope="rowgroup" colspan="4">Recorded</th></tr>${hist.map((p) => row(p.t, p.v, p.cap)).join('')}</tbody>`;
  }

  // ---------- Credentials table ----------
  let spShown = 1;
  function renderList() {
    const w = currentWindow();
    const cols = P.columnWin;
    const m = model(w);
    const now = P.now;
    // Sparkline range: the chart's history range, ending now.
    const histStart = m.history.length ? m.history[0].t : now;
    const x0 = Math.min(Math.max(histStart, now - horizonFor(w) * DAY), now - HOUR);
    const rangeLbl = x0 <= now - horizonFor(w) * DAY + MIN ? 'last ' + plural(horizonFor(w), 'day') : 'last ' + fmtDur(now - x0);
    // One row gets a label: the single credential that used the most in the last 24 h.
    const used = new Map();
    for (const c of m.consumption) if (c.t >= now - DAY) used.set(c.id, (used.get(c.id) || 0) + c.amount);
    const [most, next] = [...used].sort((x, y) => y[1] - x[1]);
    const spark = { w, x0, x1: now, top: most && next && most[1] > next[1] ? most[0] : null, head: WINDOWS[w].label + ', ' + rangeLbl };
    const head = $('cred-head');
    head.parentElement.classList.toggle('w3', cols.length >= 3);
    head.parentElement.classList.toggle('nospark', !P.samples.length);
    // With no credentials the chart's message says what to do; an empty list card would repeat it.
    head.closest('section').hidden = !P.creds.length;
    head.innerHTML = P.creds.length
      ? `<tr><th scope="col">Credential</th><th scope="col" class="sp">${esc(spark.head)}</th>` +
        cols.map((x) => `<th scope="col" class="mc${x === w ? ' sel' : ''}"><span>${esc(WINDOWS[x].label)}</span></th>`).join('') +
        '<th scope="col" class="act"><span class="sr-only">Actions</span></th></tr>'
      : '';
    const q = $('search').value.trim().toLowerCase();
    const remOf = (c) => { const r = remainingOf(usageOf(c, w), now); return r === null ? -1 : r; };
    const resetOf = (c) => { const win = usageOf(c, w); const t = win ? parseT(win.resets_at) : NaN; return isNaN(t) || t <= now ? Infinity : t; };
    let list = P.creds.filter((c) => !q || String(c.name || '').toLowerCase().includes(q) || String(c.email || '').toLowerCase().includes(q));
    if (prefs.sort === 'reset') list = [...list].sort((a, b) => resetOf(a) - resetOf(b));
    if (prefs.sort === 'remaining') list = [...list].sort((a, b) => remOf(b) - remOf(a));
    if (prefs.sort === 'least') list = [...list].sort((a, b) => remOf(a) - remOf(b));
    $('cred-meta').textContent = q ? list.length + ' of ' + P.creds.length : String(P.creds.length || '');
    const span = cols.length + 3;
    spShown = (head.querySelector('th.sp') || {}).offsetWidth ? 1 : 0;
    const body = $('cred-list');
    const foot = $('cred-foot');
    foot.hidden = true;
    if (!P.creds.length) {
      body.innerHTML = `<tr class="empty-row"><td colspan="${span}"><p>Nothing to list yet.</p></td></tr>`;
      return;
    }
    if (!list.length) {
      body.innerHTML = `<tr class="empty-row"><td colspan="${span}"><p class="msg-title">No credentials match "${esc($('search').value.trim())}"</p><p>Search looks at file names and email addresses.</p><div class="actions"><button type="button" class="btn sm" id="clear-search">Clear search</button></div></td></tr>`;
      return;
    }
    body.innerHTML = list.map((c) => rowHtml(c, cols, w, spark)).join('');
    if (body.querySelector('.bar > b')) {
      foot.innerHTML = `<span class="tick-key" aria-hidden="true"></span><span>The tick on each ${esc(WINDOWS[w].label)} bar marks how much of that window's time is left. A bar that ends left of its tick is being used faster than an even pace.<span class="foot-spark"> The small charts show ${esc(WINDOWS[w].label)} left, ${esc(spark.head.split(', ').pop())}, on the same 0 to 100% scale.</span></span>`;
      foot.hidden = false;
    }
    renderBusy();
  }

  function sparkCell(c, s, sp) {
    const lbl = `<div class="m-label">${esc(sp.head)}</div>`;
    const pts = [];
    let before = null;
    for (const { s: smp, t } of P.byId.get(c.id) || []) {
      if (!smp[sp.w]) continue;
      const v = remainingOf(smp[sp.w], t);
      if (t < sp.x0) before = v; else pts.push({ t, v });
    }
    const cur = usageOf(c, sp.w);
    if (cur && !s.disabled) pts.push({ t: sp.x1, v: remainingOf(cur, sp.x1) });
    if (before !== null) pts.unshift({ t: sp.x0, v: before });
    if (pts.length < 2) return `<td class="sp none">${lbl}<span class="m-na">No ${esc(WINDOWS[sp.w].label)} history</span></td>`;
    const VW = 160, VH = 32;
    const f1 = (n) => n.toFixed(1);
    const sx = (t) => (t - sp.x0) / (sp.x1 - sp.x0) * VW;
    const sy = (v) => 2 + (100 - v) / 100 * (VH - 4);
    let d = '';
    if (pts.length > 2 * VW) {
      // One first/min/max/last column per viewBox unit keeps peaks without drawing every sample.
      const colsMap = new Map();
      for (const p of pts) {
        const k = Math.max(0, Math.min(VW - 1, Math.floor(sx(p.t))));
        const col = colsMap.get(k);
        if (!col) colsMap.set(k, { first: p.v, min: p.v, max: p.v, last: p.v });
        else { col.min = Math.min(col.min, p.v); col.max = Math.max(col.max, p.v); col.last = p.v; }
      }
      [...colsMap.keys()].sort((a, b) => a - b).forEach((k, i) => {
        const q = colsMap.get(k);
        d += (i ? `H${k}` : `M${k},${f1(sy(q.first))}`) + `V${f1(sy(q.first))}V${f1(sy(q.max))}V${f1(sy(q.min))}V${f1(sy(q.last))}`;
      });
      d += `H${f1(sx(pts[pts.length - 1].t))}`;
    } else {
      d = pts.map((p, i) => (i ? `H${f1(sx(p.t))}V${f1(sy(p.v))}` : `M${f1(sx(p.t))},${f1(sy(p.v))}`)).join('');
    }
    const xs = f1(sx(pts[0].t));
    const lo = Math.min(...pts.map((p) => p.v));
    const aria = `${WINDOWS[sp.w].label} left, ${sp.head.split(', ').pop()}: from ${pct(pts[0].v)}, lowest ${pct(lo)}, ${s.disabled ? 'last known' : 'now'} ${pct(pts[pts.length - 1].v)}`;
    const svg = `<svg class="spark${s.disabled ? ' off' : ''}" viewBox="0 0 ${VW} ${VH}" preserveAspectRatio="none" role="img" aria-label="${esc(aria)}">` +
      `<line x1="0" x2="${VW}" y1="${VH - 2}" y2="${VH - 2}" class="sp-base"/>` +
      `<line x1="0" x2="${VW}" y1="2" y2="2" class="sp-top"/>` +
      `<path d="${d}V${VH - 2}H${xs}Z" class="sp-area"/>` +
      `<path d="${d}" class="sp-line"/></svg>`;
    const cap = c.id === sp.top ? '<div class="spark-cap">Used the most today</div>' : '';
    return `<td class="sp">${lbl}<div class="spark-wrap">${svg}${cap}</div></td>`;
  }

  function rowHtml(c, cols, w, sp) {
    const s = credState(c);
    const name = displayName(c);
    const hex = P.codes.get(c);
    const meta = [];
    if (P.dups.has(c)) meta.push(`<code>${esc(hex)}</code>`);
    let err = '';
    if (s.error) {
      const extra = s.error.headers ? ' Using rate-limit headers, which have no 7-day Fable data.' : '';
      const [head, msg] = errParts(maskText(s.error.text));
      err = `<details${openErrs.has('row-' + c.auth_index) ? ' open' : ''}><summary class="who-err">${icon('alert')}<span>Usage${NB}API${esc(head)} <u>Details</u></span></summary><p class="err-full">${esc(msg)}.${esc(extra)}</p></details>`;
    }
    const rowErr = rowErrors.get(c.auth_index);
    // Status sits inline after the hex id; a healthy row has no badge.
    if (s.disabled) meta.push(`<span class="badge">${icon('ban')}Disabled</span>`, s.fetched ? `<span>last data ${esc(fmtDateTime(s.fetched))}</span>` : '');
    if (s.cooldown) meta.push(`<span class="badge bad">${icon('clock')}Cooling down</span>`, `<span>back${NB}in${NB}${esc(fmtDur(s.cooldown.left))}, ${esc(fmtWhen(s.cooldown.until, true))}</span>`,
      `<button type="button" class="btn sm" data-reset="${esc(c.auth_index)}" title="Lets the proxy route to this credential again. Does not change the Anthropic limit.">Clear cooldown</button>`);
    if (s.error) { meta.push(`<span class="badge warn">${icon('alert')}Fetch failed</span>`); if (s.stale) meta.push(`<span>for ${esc(fmtDur(s.stale))}</span>`); }
    else if (s.stale && !s.disabled) meta.push(`<span class="badge warn">${icon('clock')}Stale</span>`, `<span>last sample ${esc(fmtDur(s.stale))} ago</span>`);
    if (s.never && !s.disabled) meta.push(`<span class="badge">${icon('dashed')}Not sampled yet</span>`);
    if (c.id === sp.top) meta.push('<span class="spark-cap">Used the most today</span>');
    const muted = isMuted(s);
    const cells = s.never ? '' : cols.map((x) => meterCell(c, x, x === w, muted, s)).join('');
    return `<tr class="${s.disabled ? 'off' : ''}" id="row-${esc(c.auth_index)}">
      <th scope="row" class="who"><div class="who-name${prefs.emails ? '' : ' masked'}" title="${esc(maskText(c.name || ''))}">${prefs.emails ? esc(name).replace('@', '<wbr>@') : esc(name)}</div><div class="who-meta">${meta.join('')}</div>${err}${rowErr ? `<div class="who-err bad" role="alert">${icon('x')}<span>${esc(rowErr)}</span></div>` : ''}</th>
      ${!s.never ? sparkCell(c, s, sp) + cells : cols.length + spShown ? `<td class="m-na" colspan="${cols.length + spShown}">No data yet</td>` : ''}
      <td class="act"><div class="act-wrap"><button type="button" class="btn sm icon ghost" data-refresh="${esc(c.auth_index)}" aria-label="Refresh quota for ${esc(name + (P.dups.has(c) ? ' ' + hex : ''))}" title="Refresh quota">${icon('refresh', 'spin')}</button></div></td>
    </tr>`;
  }

  function meterCell(c, x, selected, muted, s) {
    const label = WINDOWS[x].label;
    const lbl = `<div class="m-label${selected ? ' sel' : ''}">${esc(label)}</div>`;
    const win = usageOf(c, x);
    if (!win) return `<td class="mc">${lbl}<span class="m-na">Not reported</span></td>`;
    const now = P.now;
    const assumed = isAssumed(s, win, now);
    if (assumed) muted = true;
    const rem = remainingOf(win, now);
    const r = Math.round(rem);
    const level = s.disabled ? 'off' : muted ? 'muted' : r === 0 ? 'empty' : rem <= 10 ? 'bad' : rem <= 25 ? 'warn' : 'ok';
    const reset = parseT(win.resets_at);
    let when = '', whenText = '';
    if (!s.disabled && !isNaN(reset)) {
      if (reset <= now) { const pre = assumed ? 'assumed reset ' : 'reset ', ago = fmtDur(now - reset) + ' ago'; whenText = pre + ago; when = pre + nw(ago); }
      else { when = `<b>in${NB}${esc(fmtDur(reset - now))}</b>`; whenText = 'resets in ' + fmtDur(reset - now) + ', ' + fmtWhen(reset); }
    }
    // Text state so the level never depends on color alone.
    const tag = s.disabled ? 'Last known' : muted ? '' : r === 0 ? 'Empty' : rem <= 25 ? 'Low' : '';
    const tagHtml = tag ? `<span class="m-tag ${level}">${tag}</span>${when ? NB + '·' + NB : ''}` : '';
    // Pace tick on the charted window: the share of the window's time still to run.
    const period = WINDOWS[x].period;
    const pace = selected && !s.disabled && !isNaN(reset) && reset > now ? clampPct((reset - now) / period * 100) : null;
    const tick = pace !== null ? `<b style="left:${pace.toFixed(1)}%"></b>` : '';
    const paceText = pace !== null ? `, ${Math.round(pace)}% of the window's time left` : '';
    const state = s.disabled ? ', last known, disabled' : assumed ? ', assumed' : r === 0 ? ', empty' : muted ? ', stale' : rem <= 25 ? ', low' : '';
    return `<td class="mc"${whenText.startsWith('resets') ? ` title="${esc(whenText.charAt(0).toUpperCase() + whenText.slice(1))}"` : ''}>${lbl}<div class="m-top"><span class="m-val ${level}">${r}%</span><div class="bar ${level}" role="meter" aria-label="${esc(label)} left" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${r}" aria-valuetext="${r}% left${state}${whenText ? ', ' + esc(whenText) : ''}${paceText}"><i style="width:${rem.toFixed(1)}%"></i>${tick}</div></div><div class="m-when">${tagHtml}${when || (tagHtml ? '' : '&nbsp;')}</div></td>`;
  }

  // ---------- Events ----------
  function bindSelect(id, key, numeric) {
    $(id).addEventListener('change', (e) => {
      const v = numeric ? Number(e.target.value) : e.target.value;
      setPref(key, v);
      if (key === 'window') windowChosen = true;
      if (data) render(); else applyChrome();
    });
  }

  $('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    if ($('login-submit').getAttribute('aria-disabled') === 'true') return;
    const key = $('key-input').value.trim();
    if (!key) { setLoginError('Enter a management key.'); $('key-input').focus(); return; }
    localStorage.setItem(KEY_STORE, key);
    setLoginBusy(true);
    setLoginError('');
    await load();
    setLoginBusy(false);
  });
  $('key-input').addEventListener('input', () => { if ($('key-input').getAttribute('aria-invalid') === 'true') setLoginError(''); });
  $('logout-btn').addEventListener('click', () => { localStorage.removeItem(KEY_STORE); $('key-input').value = ''; showLogin(''); });
  $('theme-btn').addEventListener('click', () => { setPref('theme', prefs.theme === 'light' ? 'dark' : 'light'); if (data) render(); else applyChrome(); });
  $('emails-btn').addEventListener('click', () => { setPref('emails', !prefs.emails); if (data) render(); else applyChrome(); });
  $('refresh-all-btn').addEventListener('click', () => { if (data) refresh(''); else load(); });
  $('settings-btn').addEventListener('click', () => {
    const panel = $('settings');
    panel.hidden = !panel.hidden;
    $('settings-btn').setAttribute('aria-expanded', String(!panel.hidden));
  });
  $('table-btn').addEventListener('click', () => { const d = $('table-panel'); d.open = !d.open; });
  $('table-panel').addEventListener('toggle', () => {
    const open = $('table-panel').open;
    $('table-btn').setAttribute('aria-expanded', String(open));
    $('table-btn').setAttribute('aria-label', open ? 'Hide data table' : 'Show data table');
  });
  document.querySelectorAll('[data-tab]').forEach((el) => el.addEventListener('click', () => { setPref('tab', el.dataset.tab); if (data) render(); else applyChrome(); }));
  $('search').addEventListener('input', () => { if (data) renderList(); });
  document.addEventListener('click', (e) => {
    const t = e.target.closest('button');
    if (!t || !$('app').contains(t)) return;
    if (t.dataset.refresh) return refresh(t.dataset.refresh);
    if (t.dataset.reset) return resetCooldown(t.dataset.reset);
    if (t.dataset.window || t.dataset.pick) {
      const w = t.dataset.window || t.dataset.pick;
      setPref('window', w);
      windowChosen = true;
      render();
      if (t.dataset.pick) $('window-select').focus({ preventScroll: true });
      return;
    }
    if (t.dataset.act === 'reset' || t.dataset.act === 'retry') {
      if (t.getAttribute('aria-disabled') === 'true') return;
      for (const id of t.dataset.ids.split(' ')) (t.dataset.act === 'reset' ? resetCooldown : refresh)(id);
      return;
    }
    if (t.dataset.fetch) return refresh('');
    if (t.dataset.goto) return goTo(t.dataset.goto);
    if (t.id === 'retry-btn' || t.id === 'retry-btn2') return load();
    if (t.id === 'change-key-btn') { localStorage.removeItem(KEY_STORE); return showLogin(''); }
    if (t.id === 'clear-search') { $('search').value = ''; renderList(); $('search').focus(); }
  });
  $('cred-list').addEventListener('toggle', (e) => openErrs[e.target.open ? 'add' : 'delete'](e.target.closest('tr').id), true);
  // Jump from the credentials tile to a row and put focus on its refresh button.
  function goTo(authIndex) {
    const sel = `[data-refresh="${CSS.escape(authIndex)}"]`;
    if (!document.querySelector(sel) && $('search').value) { $('search').value = ''; renderList(); }
    const btn = document.querySelector(sel);
    if (!btn) return;
    const row = btn.closest('tr');
    row.scrollIntoView({ block: 'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
    btn.focus({ preventScroll: true });
    row.classList.add('flash');
    setTimeout(() => row.classList.remove('flash'), 1600);
  }

  // Clicking anywhere on a window tile selects it.
  $('tiles').addEventListener('click', (e) => {
    if (e.target.closest('button')) return;
    const tile = e.target.closest('.tile.pick');
    const b = tile && tile.querySelector('[data-window]');
    if (b) b.click();
  });

  // Chart hover and keyboard reading.
  const svgEl = $('chart-svg');
  svgEl.addEventListener('pointermove', (e) => { if (chartPoints && chartPoints.pts.length) showPoint(pointerToIndex(e)); });
  svgEl.addEventListener('pointerdown', (e) => { if (chartPoints && chartPoints.pts.length) showPoint(pointerToIndex(e)); });
  // A touch lifts with pointerleave before focus lands, so only a mouse leaving hides the readout.
  svgEl.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse' && document.activeElement !== svgEl) hideTip(); });
  svgEl.addEventListener('blur', hideTip);
  // A swipe that starts on the chart scrolls the page: the browser cancels the pointer, so drop the readout.
  svgEl.addEventListener('pointercancel', hideTip);
  addEventListener('scroll', () => { if (document.activeElement !== svgEl) hideTip(); }, { passive: true });
  svgEl.addEventListener('keydown', (e) => {
    if (!chartPoints || !chartPoints.pts.length) return;
    const n = chartPoints.pts.length;
    let i = chartIndex;
    if (i < 0) i = chartPoints.kind === 'remaining' ? Math.max(0, chartPoints.pts.findIndex((p) => p.kind === 'Now')) : n - 1;
    const big = Math.max(1, Math.round(n / 20));
    if (e.key === 'ArrowRight') i = Math.min(n - 1, i + (e.shiftKey ? big : 1));
    else if (e.key === 'ArrowLeft') i = Math.max(0, i - (e.shiftKey ? big : 1));
    else if (e.key === 'PageUp') i = Math.max(0, i - big);
    else if (e.key === 'PageDown') i = Math.min(n - 1, i + big);
    else if (e.key === 'Home') i = 0;
    else if (e.key === 'End') i = n - 1;
    else if (e.key === 'Escape') { hideTip(); chartIndex = -1; return; }
    else return;
    e.preventDefault();
    showPoint(i);
  });

  bindSelect('window-select', 'window');
  bindSelect('horizon-select', 'horizon', true);
  bindSelect('lookback-select', 'lookback', true);
  bindSelect('order-select', 'order');
  bindSelect('sort-select', 'sort');
  let resizeTimer;
  window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => {
    if (!data || $('app').hidden) return;
    renderChart();
    const sp = document.querySelector('#cred-head th.sp');
    if (sp && (sp.offsetWidth ? 1 : 0) !== spShown) renderList();
  }, 100); });
  setInterval(() => {
    if (document.hidden || $('app').hidden || !localStorage.getItem(KEY_STORE)) return;
    load();
  }, 60e3);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && !$('app').hidden && localStorage.getItem(KEY_STORE) && Date.now() - lastOkAt > 60e3) load();
  });

  applyChrome();
  if (localStorage.getItem(KEY_STORE) === null) showLogin('');
  else { showApp(); loading = true; render(); load(); }
})();
</script>
</body>
</html>
